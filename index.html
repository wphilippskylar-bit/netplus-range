  S.push({
    id: 'p18', tier: 'pro', title: 'Automation & infrastructure as code', code: 'PRO18-CONFIG-AS-CODE',
    goal: 'Read and reason about Python/Netmiko, Ansible, REST APIs, JSON/YAML, Git workflows and config templating.',
    lesson: [
      { h: 'Why automation', html: '<p>A 10-year engineer does not SSH into 200 switches to change an NTP server. They change one line in Git and a pipeline does it — consistently, with a review, a test, and an audit trail. Automation is the difference between being a technician and being an engineer that companies fight over.</p>' },
      { h: 'Data formats', html: '<pre>JSON                                YAML\n{                                   hostname: core-sw1\n  "hostname": "core-sw1",          vlans:\n  "vlans": [10, 20],                  - 10\n  "mgmt": {"ip": "10.0.0.5"}          - 20\n}                                   mgmt:\n                                      ip: 10.0.0.5</pre><p>YAML is indentation-sensitive (spaces, not tabs). JSON uses braces and quotes. XML is used by NETCONF.</p>' },
      { h: 'Python + Netmiko', html: '<pre>from netmiko import ConnectHandler\n\nswitches = ["10.0.0.11", "10.0.0.12"]\nfor ip in switches:\n    conn = ConnectHandler(device_type="cisco_ios", host=ip,\n                          username="admin", password=PW)\n    out = conn.send_config_set(["ntp server 10.0.0.123"])\n    print(ip, conn.send_command("show ntp associations"))\n    conn.disconnect()</pre><p>Read it like a sentence: for each IP, connect over SSH, push config, verify, disconnect. Secrets never hard-coded — use environment variables or a vault.</p>' },
      { h: 'Ansible', html: '<pre>- name: Standard NTP\n  hosts: switches\n  gather_facts: no\n  tasks:\n    - name: Set NTP server\n      cisco.ios.ios_config:\n        lines:\n          - ntp server 10.0.0.123</pre><p>Agentless (SSH), <b>inventory</b> lists hosts, <b>playbooks</b> are YAML, modules are <b>idempotent</b> (running twice changes nothing the second time). Jinja2 templates generate configs from variables.</p>' },
      { h: 'APIs', html: '<ul><li><b>REST</b> over HTTPS: GET (read), POST (create), PUT/PATCH (update), DELETE. Responses: 200 OK, 201 Created, 204 No Content, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 500 Server Error.</li><li><b>NETCONF</b> (SSH 830, XML, YANG models) and <b>RESTCONF</b> (HTTPS, JSON/XML, YANG).</li><li>Auth: API keys/tokens in headers, OAuth.</li><li>Streaming <b>telemetry</b> (gNMI) replaces SNMP polling at scale.</li></ul>' },
      { h: 'Git & pipelines', html: '<pre>git clone repo  →  git checkout -b ntp-change  →  edit  →  git add .\ngit commit -m "Standardize NTP"  →  git push  →  pull request  →  review\n→ CI: lint + test in lab  →  merge  →  CD: deploy to prod</pre><p><b>Source of truth</b> (NetBox, Nautobot, Git) holds intended state; automation enforces it and detects <b>configuration drift</b>.</p>' }
    ],
    cards: [
      ['Idempotent', 'Running the same automation again makes no further changes.'], ['Ansible', 'Agentless automation tool using YAML playbooks over SSH/API.'], ['Netmiko', 'Python library for SSH to network devices.'], ['Jinja2', 'Templating language used to generate configs from variables.'],
      ['REST GET/POST/PUT/DELETE', 'Read / create / replace / remove.'], ['HTTP 401 vs 403', 'Not authenticated vs authenticated but not allowed.'], ['HTTP 201', 'Created.'], ['NETCONF', 'SSH (830) based XML config protocol using YANG models.'], ['RESTCONF', 'HTTPS REST interface to YANG data.'], ['YANG', 'Data modeling language for network configuration.'],
      ['Source of truth', 'Authoritative intended-state database (NetBox, Git).'], ['Configuration drift', 'Running config diverging from the intended baseline.'], ['CI/CD', 'Continuous integration/deployment — automated test and rollout pipeline.'], ['Pull request', 'Proposed change reviewed before merging.'], ['gNMI telemetry', 'Streaming model-driven telemetry; replaces SNMP polling.']
    ],
    qs: [
      Q('An Ansible playbook runs twice; the second run reports zero changes. This property is called:', 'Idempotency', ['Elasticity', 'Orchestration drift', 'Statefulness'], 'Idempotent modules only change what differs from desired state.'),
      Q('A REST call returns 401. What does it mean?', 'Authentication is missing or invalid', ['The resource was created', 'The server crashed', 'Authenticated but forbidden'], '401 Unauthorized vs 403 Forbidden.'),
      Q('Which HTTP method creates a new object through a REST API?', 'POST', ['GET', 'DELETE', 'HEAD'], 'POST creates; PUT/PATCH update.'),
      Q('NETCONF runs over which transport/port by default?', 'SSH on 830', ['HTTPS on 443', 'Telnet on 23', 'SNMP on 161'], 'RESTCONF uses HTTPS.'),
      Q('What file format are Ansible playbooks written in?', 'YAML', ['JSON only', 'XML', 'CSV'], 'YAML; indentation matters.'),
      { q: 'Read the script. What does it do?\n\nfor ip in ["10.0.0.11","10.0.0.12"]:\n    c = ConnectHandler(device_type="cisco_ios", host=ip, username=u, password=p)\n    print(c.send_command("show ip int brief"))\n    c.disconnect()', c: ['Logs into two switches over SSH and prints their interface summaries', 'Configures IP addresses on two switches', 'Pings two IPs', 'Backs up configs to TFTP'], a: 0, e: 'send_command runs an exec command and returns the output; no config is changed.' },
      Q('Running configs on 30 switches no longer match the approved template. What is this called?', 'Configuration drift', ['Route flapping', 'Jitter', 'Split brain'], 'Automation can detect and remediate drift against the source of truth.'),
      Q('Which tool would generate 200 switch configs from one template and a spreadsheet of variables?', 'Jinja2 templating', ['Wireshark', 'nmap', 'SNMP traps'], 'Template + variables = consistent configs.'),

  S.push({
    id: 'p19', tier: 'pro', title: 'Packet analysis & security operations', code: 'PRO19-READ-THE-WIRE',
    goal: 'Wireshark and tcpdump filters, reading handshakes and failures, and the network side of incident response.',
    lesson: [
      { h: 'Capture filters vs display filters', html: '<p><b>Capture filters</b> (BPF, used by tcpdump and Wireshark capture) decide what gets recorded. <b>Display filters</b> (Wireshark) decide what you see.</p><table><tr><th>Goal</th><th>tcpdump / BPF</th><th>Wireshark display</th></tr>' +
        [['One host', 'host 10.1.1.5', 'ip.addr == 10.1.1.5'], ['Port', 'port 443', 'tcp.port == 443'], ['DNS', 'udp port 53', 'dns'], ['SYNs only', "'tcp[tcpflags] & tcp-syn != 0'", 'tcp.flags.syn == 1 && tcp.flags.ack == 0'], ['Resets', '—', 'tcp.flags.reset == 1'], ['Retransmissions', '—', 'tcp.analysis.retransmission'], ['HTTP requests', '—', 'http.request'], ['DHCP', 'port 67 or port 68', 'dhcp'], ['ARP', 'arp', 'arp']].map(function (r) { return '<tr><td>' + r[0] + '</td><td><code>' + r[1] + '</code></td><td><code>' + r[2] + '</code></td></tr>'; }).join('') + '</table><pre>tcpdump -i eth0 -nn host 10.1.1.5 and port 443 -w case.pcap</pre>' },
      { h: 'Reading the story in a capture', html: '<ul><li><b>SYN, no SYN/ACK</b> → packets dropped on the way (firewall drop, routing, host down).</li><li><b>SYN → RST</b> → host reachable, port closed (or a firewall rejecting).</li><li><b>Handshake OK, then TLS alert</b> → certificate/cipher problem, not the network.</li><li><b>Many retransmissions / dup ACKs</b> → loss, congestion, bad link.</li><li><b>Zero window</b> → the receiver (app/server) is slow, not the network.</li><li><b>DNS NXDOMAIN / SERVFAIL</b> → name problem.</li><li>Measure where time goes: network RTT (SYN→SYN/ACK) vs server think time (request→response).</li></ul>' +

    devices: [{ n: 'PC1', type: 'pc', x: 10, y: 80 }, { n: 'SW1', type: 'sw', x: 50, y: 25 }, { n: 'DNS', type: 'srv', x: 60, y: 85, services: { dns: { 'intranet.lab': '10.0.0.80', 'mail.lab': '10.0.0.25' } } }, { n: 'WEB', type: 'srv', x: 92, y: 70, services: { http: '<h1>Intranet</h1> Welcome, Phil.' } }],
    links: [['PC1', 'eth0', 'SW1', 'F0/1'], ['DNS', 'eth0', 'SW1', 'F0/2'], ['WEB', 'eth0', 'SW1', 'F0/3']],
    pre: { DNS: ['ip 10.0.0.53/24'], WEB: ['ip 10.0.0.80/24'] },
    tasks: [
      { t: 'PC1 has an address in 10.0.0.0/24', c: function (H) { return pcIn(H, 'PC1', '10.0.0.0', 24); } },
      { t: 'PC1 uses 10.0.0.53 as its DNS server', c: function (H) { return H.dev('PC1').dns === NS.ip2n('10.0.0.53'); } },
      { t: 'You resolved intranet.lab with nslookup', c: function (H) { return H.dev('PC1').history.some(function (c) { return /^nslookup\s+intranet\.lab\s*$/i.test(c.trim()); }); } },
      { t: 'PC1 loads the intranet site (TCP 80)', c: function (H) { return H.web('PC1', '10.0.0.80') && H.dev('PC1').history.some(function (c) { return /^(web|curl)\s+intranet\.lab/i.test(c.trim()); }); } }
    ],
    hints: ['<code>ip 10.0.0.10 255.255.255.0</code>', '<code>dns 10.0.0.53</code> then <code>nslookup intranet.lab</code>', '<code>web intranet.lab</code>. Try <code>nslookup nothere.lab</code> to see NXDOMAIN.'],
    solution: { PC1: ['ip 10.0.0.10 255.255.255.0', 'dns 10.0.0.53', 'nslookup intranet.lab', 'web intranet.lab'] },
    debrief: 'Name → IP (DNS, UDP 53) happened first, then a TCP connection to port 80. Two different services — two different things that can break.'
  };

  // ---------------- s07 ----------------
  L['l-vlans'] = {
    kind: 'net', title: 'Split the switch', sum: 'Create VLANs and prove isolation', start: 'SW1',
    brief: 'All four PCs are in the same IP subnet on one flat switch. Create <b>VLAN 10 named SALES</b> (F0/1, F0/2) and <b>VLAN 20 named ENG</b> (F0/3, F0/4). Afterwards Sales and Eng must NOT reach each other even though their IPs share a subnet — that is Layer 2 isolation.',
    devices: [{ n: 'SALES1', type: 'pc', x: 5, y: 85 }, { n: 'SALES2', type: 'pc', x: 30, y: 85 }, { n: 'SW1', type: 'sw', x: 50, y: 25 }, { n: 'ENG1', type: 'pc', x: 70, y: 85 }, { n: 'ENG2', type: 'pc', x: 95, y: 85 }],
    links: [['SALES1', 'eth0', 'SW1', 'F0/1'], ['SALES2', 'eth0', 'SW1', 'F0/2'], ['ENG1', 'eth0', 'SW1', 'F0/3'], ['ENG2', 'eth0', 'SW1', 'F0/4']],
    pre: { SALES1: ['ip 192.168.1.11/24'], SALES2: ['ip 192.168.1.12/24'], ENG1: ['ip 192.168.1.21/24'], ENG2: ['ip 192.168.1.22/24'] },
    tasks: [
      { t: 'VLAN 10 exists and is named SALES', c: function (H) { return /^sales$/i.test(H.dev('SW1').vlans[10] || ''); } },
      { t: 'VLAN 20 exists and is named ENG', c: function (H) { return /^eng$/i.test(H.dev('SW1').vlans[20] || ''); } },
      { t: 'F0/1–F0/2 in VLAN 10, F0/3–F0/4 in VLAN 20', c: function (H) { return vlanOf(H, 'SW1', 'F0/1') === 10 && vlanOf(H, 'SW1', 'F0/2') === 10 && vlanOf(H, 'SW1', 'F0/3') === 20 && vlanOf(H, 'SW1', 'F0/4') === 20; } },
      { t: 'SALES1 ↔ SALES2 and ENG1 ↔ ENG2 still work', c: function (H) { return H.ping('SALES1', '192.168.1.12') && H.ping('ENG1', '192.168.1.22'); } },
      { t: 'SALES1 can NOT reach ENG1 (isolated)', c: function (H) { return !H.ping('SALES1', '192.168.1.21'); } }
    ],
    hints: ['<code>vlan 10</code> → <code>name SALES</code>, then <code>vlan 20</code> → <code>name ENG</code>.', '<code>interface range f0/1 - 2</code> → <code>switchport mode access</code> → <code>switchport access vlan 10</code>', 'Verify: <code>do show vlan brief</code>'],
    solution: { SW1: ['enable', 'conf t', 'vlan 10', 'name SALES', 'vlan 20', 'name ENG', 'interface range f0/1 - 2', 'switchport mode access', 'switchport access vlan 10', 'interface range f0/3 - 4', 'switchport mode access', 'switchport access vlan 20', 'end', 'show vlan brief'] },
    debrief: 'Same subnet, no connectivity — because VLANs are separate broadcast domains, ARP from SALES1 never reaches ENG1. In real life you would also give each VLAN its own subnet.'
  };

  L['l-trunk'] = {
    kind: 'net', title: 'Stretch VLANs across a trunk', sum: '802.1Q trunk between two switches', start: 'SW2',
    brief: 'SW1 is already configured (VLAN 10 on F0/1, VLAN 20 on F0/2). SW2 is factory-default. Make VLANs 10 and 20 work across both switches over the G0/1 link. Security standard: the trunk must allow <b>only VLANs 10 and 20</b> and use <b>native VLAN 999</b> on both ends.',
    devices: [{ n: 'PC1', type: 'pc', x: 5, y: 85 }, { n: 'PC2', type: 'pc', x: 30, y: 85 }, { n: 'SW1', type: 'sw', x: 18, y: 30 }, { n: 'SW2', type: 'sw', x: 82, y: 30 }, { n: 'PC3', type: 'pc', x: 70, y: 85 }, { n: 'PC4', type: 'pc', x: 95, y: 85 }],
    links: [['PC1', 'eth0', 'SW1', 'F0/1'], ['PC2', 'eth0', 'SW1', 'F0/2'], ['SW1', 'G0/1', 'SW2', 'G0/1'], ['PC3', 'eth0', 'SW2', 'F0/1'], ['PC4', 'eth0', 'SW2', 'F0/2']],
    pre: { SW1: ['en', 'conf t', 'vlan 10', 'name USERS', 'vlan 20', 'name PHONES', 'int f0/1', 'switchport mode access', 'switchport access vlan 10', 'int f0/2', 'switchport mode access', 'switchport access vlan 20', 'end'],
      PC1: ['ip 10.10.10.11/24'], PC2: ['ip 10.10.20.12/24'], PC3: ['ip 10.10.10.13/24'], PC4: ['ip 10.10.20.14/24'] },
    tasks: [
      { t: 'PC1 (VLAN 10) reaches PC3 (VLAN 10 on SW2)', c: function (H) { return H.ping('PC1', '10.10.10.13'); } },
      { t: 'PC2 (VLAN 20) reaches PC4 (VLAN 20 on SW2)', c: function (H) { return H.ping('PC2', '10.10.20.14'); } },
      { t: 'Both trunk ends allow only VLANs 10,20', c: function (H) { return ['SW1', 'SW2'].every(function (s) { var a = H.ifc(s, 'G0/1').allowed; return H.ifc(s, 'G0/1').mode === 'trunk' && a && a.length === 2 && a.indexOf(10) >= 0 && a.indexOf(20) >= 0; }); } },
      { t: 'Native VLAN is 999 on both ends', c: function (H) { return H.ifc('SW1', 'G0/1').native === 999 && H.ifc('SW2', 'G0/1').native === 999; } }
    ],
    hints: ['The VLANs must EXIST on SW2 too: <code>vlan 10</code>, <code>vlan 20</code>.', 'On both switches: <code>int g0/1</code> → <code>switchport mode trunk</code> → <code>switchport trunk allowed vlan 10,20</code> → <code>switchport trunk native vlan 999</code>', 'Do not forget SW2 F0/1 and F0/2 access VLANs. Check with <code>show interfaces trunk</code>.'],
    solution: { SW1: ['enable', 'conf t', 'int g0/1', 'switchport mode trunk', 'switchport trunk allowed vlan 10,20', 'switchport trunk native vlan 999', 'end'], SW2: ['enable', 'conf t', 'vlan 10', 'vlan 20', 'int f0/1', 'switchport mode access', 'switchport access vlan 10', 'int f0/2', 'switchport mode access', 'switchport access vlan 20', 'int g0/1', 'switchport mode trunk', 'switchport trunk allowed vlan 10,20', 'switchport trunk native vlan 999', 'end', 'show interfaces trunk'] },
    debrief: 'Try removing "vlan 20" from SW2 — VLAN 20 dies even though the trunk allows it. VLANs must exist everywhere they travel.'
  };

  // ---------------- s08 ----------------
  L['l-static'] = {
    kind: 'net', title: 'Static routing both ways', sum: 'Two routers, two LANs', start: 'R1',
    brief: 'PC1 (192.168.1.10) and PC2 (192.168.2.10) are configured. Build the routers: <b>R1</b> G0/0 = 192.168.1.1/24, G0/1 = 10.0.12.1/30. <b>R2</b> G0/0 = 192.168.2.1/24, G0/1 = 10.0.12.2/30. Then add static routes so the LANs reach each other. Remember: <b>every direction needs a route</b>.',
    devices: [{ n: 'PC1', type: 'pc', x: 5, y: 75 }, { n: 'R1', type: 'rtr', x: 32, y: 25 }, { n: 'R2', type: 'rtr', x: 68, y: 25 }, { n: 'PC2', type: 'pc', x: 95, y: 75 }],
    links: [['PC1', 'eth0', 'R1', 'G0/0'], ['R1', 'G0/1', 'R2', 'G0/1'], ['R2', 'G0/0', 'PC2', 'eth0']],
    pre: { PC1: ['ip 192.168.1.10/24 192.168.1.1'], PC2: ['ip 192.168.2.10/24 192.168.2.1'] },
    tasks: [
      { t: 'All four router interfaces addressed and up', c: function (H) { return ipIs(H, 'R1', 'G0/0', '192.168.1.1', 24) && ipIs(H, 'R1', 'G0/1', '10.0.12.1', 30) && ipIs(H, 'R2', 'G0/0', '192.168.2.1', 24) && ipIs(H, 'R2', 'G0/1', '10.0.12.2', 30) && ['G0/0', 'G0/1'].every(function (i) { return up(H, 'R1', i) && up(H, 'R2', i); }); } },
      { t: 'R1 has a static route to 192.168.2.0/24', c: function (H) { return hasRoute(H, 'R1', '192.168.2.0', 24); } },
      { t: 'R2 has a static route to 192.168.1.0/24', c: function (H) { return hasRoute(H, 'R2', '192.168.1.0', 24); } },
      { t: 'PC1 pings PC2', c: function (H) { return H.ping('PC1', '192.168.2.10'); } }
    ],
    hints: ['Do R1 first and try <code>ping 192.168.2.10</code> from PC1 — read the [sim hint].', 'R1: <code>ip route 192.168.2.0 255.255.255.0 10.0.12.2</code>', 'R2 needs the mirror image: <code>ip route 192.168.1.0 255.255.255.0 10.0.12.1</code>. Check with <code>show ip route</code>.'],
    solution: { R1: ['enable', 'conf t', 'int g0/0', 'ip address 192.168.1.1 255.255.255.0', 'no shut', 'int g0/1', 'ip address 10.0.12.1 255.255.255.252', 'no shut', 'exit', 'ip route 192.168.2.0 255.255.255.0 10.0.12.2', 'end'], R2: ['enable', 'conf t', 'int g0/0', 'ip address 192.168.2.1 255.255.255.0', 'no shut', 'int g0/1', 'ip address 10.0.12.2 255.255.255.252', 'no shut', 'exit', 'ip route 192.168.1.0 255.255.255.0 10.0.12.1', 'end'] },
    debrief: 'Run tracert from PC1: two hops, then PC2. If you remove R2\'s route, the request still arrives but the reply dies — the sim hint calls it out. That is the #1 static routing mistake in real networks.'
  };

  L['l-roas'] = {
    kind: 'net', title: 'Router-on-a-stick', sum: 'Inter-VLAN routing with subinterfaces', start: 'R1',
    brief: 'SW1 has VLAN 10 (PC1, 192.168.10.10, gw .1) and VLAN 20 (PC2, 192.168.20.10, gw .1) already configured. Route between them using ONE router port: make SW1 G0/1 a trunk, bring R1 G0/0 up, and create subinterfaces <b>G0/0.10</b> (192.168.10.1/24) and <b>G0/0.20</b> (192.168.20.1/24).',
    devices: [{ n: 'PC1', type: 'pc', x: 8, y: 85 }, { n: 'SW1', type: 'sw', x: 50, y: 55 }, { n: 'PC2', type: 'pc', x: 92, y: 85 }, { n: 'R1', type: 'rtr', x: 50, y: 8 }],
    links: [['PC1', 'eth0', 'SW1', 'F0/1'], ['PC2', 'eth0', 'SW1', 'F0/2'], ['SW1', 'G0/1', 'R1', 'G0/0']],
    pre: { SW1: ['en', 'conf t', 'vlan 10', 'vlan 20', 'int f0/1', 'switchport mode access', 'switchport access vlan 10', 'int f0/2', 'switchport mode access', 'switchport access vlan 20', 'end'], PC1: ['ip 192.168.10.10/24 192.168.10.1'], PC2: ['ip 192.168.20.10/24 192.168.20.1'] },
    tasks: [
      { t: 'SW1 G0/1 is a trunk', c: function (H) { return H.ifc('SW1', 'G0/1').mode === 'trunk'; } },
      { t: 'R1 G0/0.10 = 192.168.10.1/24 with dot1Q 10', c: function (H) { var i = H.ifc('R1', 'G0/0.10'); return !!i && i.encap === 10 && ipIs(H, 'R1', 'G0/0.10', '192.168.10.1', 24); } },
      { t: 'R1 G0/0.20 = 192.168.20.1/24 with dot1Q 20', c: function (H) { var i = H.ifc('R1', 'G0/0.20'); return !!i && i.encap === 20 && ipIs(H, 'R1', 'G0/0.20', '192.168.20.1', 24); } },
      { t: 'PC1 pings PC2 through the router', c: function (H) { return H.ping('PC1', '192.168.20.10'); } }
    ],
    hints: ['Physical G0/0 needs <code>no shutdown</code> — subinterfaces inherit it. No IP on the physical port.', '<code>interface g0/0.10</code> → <code>encapsulation dot1Q 10</code> → <code>ip address 192.168.10.1 255.255.255.0</code>', 'Switch: <code>int g0/1</code> → <code>switchport mode trunk</code>'],
    solution: { SW1: ['enable', 'conf t', 'int g0/1', 'switchport mode trunk', 'end'], R1: ['enable', 'conf t', 'int g0/0', 'no shut', 'int g0/0.10', 'encapsulation dot1Q 10', 'ip address 192.168.10.1 255.255.255.0', 'int g0/0.20', 'encapsulation dot1Q 20', 'ip address 192.168.20.1 255.255.255.0', 'end'] },
    debrief: 'Traffic from PC1 goes up the trunk tagged 10, the router routes it, and sends it back down tagged 20 — hairpinning over one cable. A Layer 3 switch with SVIs does the same thing in hardware.'
  };

  // ---------------- s11 ----------------
  L['l-dhcp'] = {
    kind: 'net', title: 'Build a DHCP server', sum: 'Pool, gateway, DNS, exclusions', start: 'R1',
    brief: 'R1 G0/0 is already 192.168.50.1/24. The printer PRN is static at <b>192.168.50.5</b>. Create a DHCP pool on R1 for 192.168.50.0/24 with default-router 192.168.50.1 and dns-server 192.168.50.1, <b>excluding .1–.10</b> for infrastructure. Then run <code>ip dhcp</code> on PC1 and PC2.',
    devices: [{ n: 'R1', type: 'rtr', x: 50, y: 8 }, { n: 'SW1', type: 'sw', x: 50, y: 50 }, { n: 'PC1', type: 'pc', x: 8, y: 88 }, { n: 'PC2', type: 'pc', x: 50, y: 92 }, { n: 'PRN', type: 'pc', x: 92, y: 88 }],
    links: [['R1', 'G0/0', 'SW1', 'G0/1'], ['PC1', 'eth0', 'SW1', 'F0/1'], ['PC2', 'eth0', 'SW1', 'F0/2'], ['PRN', 'eth0', 'SW1', 'F0/3']],
    pre: { R1: ['en', 'conf t', 'int g0/0', 'ip address 192.168.50.1 255.255.255.0', 'no shut', 'end'], PRN: ['ip 192.168.50.5/24 192.168.50.1'] },
    tasks: [
      { t: 'A pool for 192.168.50.0/24 with default-router .1', c: function (H) { var p = H.dev('R1').pools; return Object.keys(p).some(function (k) { return p[k].net === NS.ip2n('192.168.50.0') && p[k].mask === NS.pfx2mask(24) && p[k].gw === NS.ip2n('192.168.50.1'); }); } },
      { t: 'Addresses .1 through .10 are excluded', c: function (H) { var e = H.dev('R1').excl, a = NS.ip2n('192.168.50.1'); for (var k = 0; k < 10; k++) { var x = a + k; if (!e.some(function (r) { return x >= r[0] && x <= r[1]; })) return false; } return true; } },
      { t: 'PC1 and PC2 got leases above .10 via DHCP', c: function (H) { return ['PC1', 'PC2'].every(function (p) { var e = H.ifc(p, 'eth0'); return e.dhcp && pcIn(H, p, '192.168.50.0', 24, '192.168.50.1') && (e.ip & 255) > 10; }); } },
      { t: 'PC1 can reach the printer', c: function (H) { return H.ping('PC1', '192.168.50.5'); } }
    ],
    hints: ['Exclusions first: <code>ip dhcp excluded-address 192.168.50.1 192.168.50.10</code>', '<code>ip dhcp pool LAN</code> → <code>network 192.168.50.0 255.255.255.0</code> → <code>default-router 192.168.50.1</code> → <code>dns-server 192.168.50.1</code>', 'On the PCs: <code>ip dhcp</code>. On R1: <code>show ip dhcp binding</code>.'],
    solution: { R1: ['enable', 'conf t', 'ip dhcp excluded-address 192.168.50.1 192.168.50.10', 'ip dhcp pool LAN', 'network 192.168.50.0 255.255.255.0', 'default-router 192.168.50.1', 'dns-server 192.168.50.1', 'end'], PC1: ['ip dhcp'], PC2: ['ip dhcp'] },
    debrief: 'Without the exclusion, DHCP could hand .5 to a PC and collide with the printer — the classic "duplicate IP every morning" ticket.'
  };

  L['l-relay'] = {
    kind: 'net', title: 'DHCP relay across routers', sum: 'ip helper-address', start: 'PC1',
    brief: 'Corporate runs DHCP centrally on <b>HQ (10.0.0.2)</b>, which already has a pool for 192.168.60.0/24. PC1 is on a branch LAN behind BR1. Run <code>ip dhcp</code> on PC1 — it fails (gets nothing). Fix it on BR1 so the broadcast is relayed to HQ.',
    devices: [{ n: 'PC1', type: 'pc', x: 6, y: 80 }, { n: 'SW1', type: 'sw', x: 25, y: 40 }, { n: 'BR1', type: 'rtr', x: 55, y: 20 }, { n: 'HQ', type: 'rtr', x: 92, y: 55 }],
    links: [['PC1', 'eth0', 'SW1', 'F0/1'], ['SW1', 'G0/1', 'BR1', 'G0/0'], ['BR1', 'G0/1', 'HQ', 'G0/0']],
    pre: { BR1: ['en', 'conf t', 'hostname BR1', 'int g0/0', 'ip address 192.168.60.1 255.255.255.0', 'no shut', 'int g0/1', 'ip address 10.0.0.1 255.255.255.252', 'no shut', 'end'],
      HQ: ['en', 'conf t', 'int g0/0', 'ip address 10.0.0.2 255.255.255.252', 'no shut', 'exit', 'ip route 192.168.60.0 255.255.255.0 10.0.0.1', 'ip dhcp excluded-address 192.168.60.1 192.168.60.20', 'ip dhcp pool BRANCH60', 'network 192.168.60.0 255.255.255.0', 'default-router 192.168.60.1', 'end'] },
    tasks: [
      { t: 'BR1 G0/0 relays DHCP to 10.0.0.2', c: function (H) { return H.ifc('BR1', 'G0/0').helper === NS.ip2n('10.0.0.2'); } },
      { t: 'PC1 leased an address from HQ', c: function (H) { var e = H.ifc('PC1', 'eth0'); return e.dhcp && pcIn(H, 'PC1', '192.168.60.0', 24, '192.168.60.1'); } },
      { t: 'PC1 can ping HQ (10.0.0.2)', c: function (H) { return H.ping('PC1', '10.0.0.2'); } }
    ],
    hints: ['The helper goes on the interface that RECEIVES the broadcast — the LAN side, G0/0.', '<code>interface g0/0</code> → <code>ip helper-address 10.0.0.2</code>'],
    solution: { BR1: ['enable', 'conf t', 'interface g0/0', 'ip helper-address 10.0.0.2', 'end'], PC1: ['ip dhcp', 'ping 10.0.0.2'] },
    debrief: 'The relay turns the Discover broadcast into a unicast to HQ and stamps it with the LAN interface IP (giaddr) — that is how HQ knows which pool to use.'
  };

  // ---------------- s12 ----------------
  L['l-docs'] = {
    kind: 'net', title: 'Document what you find', sum: 'CDP discovery + interface descriptions', start: 'EDGE',
    brief: 'You inherited a site with zero documentation. On <b>EDGE</b>, <b>CORE-SW</b> and <b>FLOOR2-SW</b>, every interface that has a cable must get a <code>description</code> naming the neighbor device it connects to (e.g. <code>description to CORE-SW G0/2</code>). Discover neighbors with <code>show cdp neighbors</code> — do not trust the map labels, trust the device.',
    devices: [{ n: 'EDGE', type: 'rtr', x: 50, y: 6 }, { n: 'CORE-SW', type: 'sw', x: 50, y: 42 }, { n: 'FLOOR2-SW', type: 'sw', x: 15, y: 80 }, { n: 'PRINTER', type: 'pc', x: 55, y: 92 }, { n: 'NAS', type: 'srv', x: 90, y: 80 }, { n: 'KIOSK', type: 'pc', x: 10, y: 40 }],
    links: [['EDGE', 'G0/0', 'CORE-SW', 'G0/2'], ['CORE-SW', 'G0/1', 'FLOOR2-SW', 'G0/1'], ['CORE-SW', 'F0/7', 'PRINTER', 'eth0'], ['CORE-SW', 'F0/4', 'NAS', 'eth0'], ['FLOOR2-SW', 'F0/3', 'KIOSK', 'eth0']],
    pre: { EDGE: ['en', 'conf t', 'hostname EDGE', 'int g0/0', 'ip address 10.0.0.1 255.255.255.0', 'no shut', 'end'] },
    tasks: (function () {
      function desc(dev, ifc, want) { return { t: dev + ' ' + ifc + ' description mentions ' + want, c: function (H) { return new RegExp(want.replace('-', '\\-'), 'i').test(H.ifc(dev, ifc).desc || ''); } }; }
      return [desc('EDGE', 'G0/0', 'CORE-SW'), desc('CORE-SW', 'G0/2', 'EDGE'), desc('CORE-SW', 'G0/1', 'FLOOR2-SW'), desc('CORE-SW', 'F0/7', 'PRINTER'), desc('CORE-SW', 'F0/4', 'NAS'), desc('FLOOR2-SW', 'G0/1', 'CORE-SW'), desc('FLOOR2-SW', 'F0/3', 'KIOSK')];
    })(),
    hints: ['On each device: <code>enable</code> → <code>show cdp neighbors</code>. The "Local Intrfce" column is the port to label.', '<code>conf t</code> → <code>int f0/7</code> → <code>description to PRINTER</code>', 'Verify with <code>show interfaces status</code> — descriptions appear in the last column.'],
    solution: { EDGE: ['enable', 'conf t', 'int g0/0', 'description to CORE-SW G0/2', 'end'], 'CORE-SW': ['enable', 'show cdp neighbors', 'conf t', 'int g0/2', 'description to EDGE G0/0', 'int g0/1', 'description to FLOOR2-SW G0/1', 'int f0/7', 'description to PRINTER', 'int f0/4', 'description to NAS', 'end'], 'FLOOR2-SW': ['enable', 'conf t', 'int g0/1', 'description to CORE-SW G0/1', 'int f0/3', 'description to KIOSK', 'end'] },
    debrief: 'At 3 AM during an outage, "description to CORE-SW G0/2" is worth more than any diagram. Make it a habit on every port you touch.'
  };

  // ---------------- s13 ----------------
  L['l-acl'] = {

    devices: [{ n: 'STAFF', type: 'pc', x: 6, y: 85 }, { n: 'GUEST', type: 'pc', x: 40, y: 88 }, { n: 'SW1', type: 'sw', x: 22, y: 45 }, { n: 'R1', type: 'rtr', x: 55, y: 10 }, { n: 'SRV', type: 'srv', x: 92, y: 55, services: { http: 'Finance portal', ssh: true } }],
    links: [['STAFF', 'eth0', 'SW1', 'F0/1'], ['GUEST', 'eth0', 'SW1', 'F0/2'], ['SW1', 'G0/1', 'R1', 'G0/0'], ['R1', 'G0/1', 'SRV', 'eth0']],

      STAFF: ['ip 192.168.10.10/24 192.168.10.1'], GUEST: ['ip 192.168.20.10/24 192.168.20.1'], SRV: ['ip 10.9.9.10/24 10.9.9.1'] },

        if (!q.gen) { if (ok) delete S.missed[s.id + ':' + idx]; else S.missed[s.id + ':' + idx] = 1; persist(); }
        var b = document.createElement('div'); b.className = 'row'; b.style.marginTop = '10px';
        b.innerHTML = '<button class="btn pri" id="nx">Next question</button>'; $('#qp', p).appendChild(b);
        $('#nx', p).onclick = next; $('#nx', p).focus();
      }, true);
    }
    next();
  }
  // wire answering for a rendered question. instant=true shows explanation.
  function wire(box, q, done, instant) {
    var answered = false;
    function finish(ok, picked) {
      if (answered) return; answered = true;
      if (!q.input && instant) box.querySelectorAll('.choice').forEach(function (b) {
        var ci = +b.dataset.c; if (ci === q.a) b.classList.add('right'); else if (ci === picked) b.classList.add('wrong'); b.disabled = true;
      });
      if (instant) box.insertAdjacentHTML('beforeend', explainHtml(q, ok));
      done(ok, picked);
    }
    if (q.input) {
      var inp = $('#ain', box), sub = $('#asub', box);
      sub.onclick = function () { if (!inp.value.trim()) return; inp.disabled = true; sub.disabled = true; finish(checkInput(q, inp.value), inp.value); };
      inp.onkeydown = function (e) { if (e.key === 'Enter') sub.click(); };
      if (document.body.classList.contains('pc')) inp.focus();
    } else box.querySelectorAll('.choice').forEach(function (b) { b.onclick = function () { finish(+b.dataset.c === q.a, +b.dataset.c); }; });
  }

  // ---------- gate test ----------
  function pGate(p, s) {
    var x = st(s.id);
    if (!gateReady(s)) {
      p.innerHTML = '<div class="panel"><h2>🔒 Gate locked</h2><p>Before you can test out of this step:</p><ul>' +
        '<li>' + (x.lesson ? '✓' : '○') + ' Read the lesson and mark it complete</li>' +
        ((s.labs || []).length ? '<li>' + (labsDone(s) === s.labs.length ? '✓' : '○') + ' Complete every lab (' + labsDone(s) + '/' + s.labs.length + ')</li>' : '') +
        '</ul><p class="muted">Then score <b>over ' + PASS + '%</b> to unlock the next step and earn your checkpoint phrase.</p></div>';
      return;
    }
    var cap = s.capstone, n = cap ? cap.n : Math.min(s.gateN || 15, s.qs.length);
    p.innerHTML = '<div class="panel"><h2>' + (cap ? 'Capstone exam' : 'Gate test') + '</h2>' +
      '<p>' + n + ' questions' + (cap ? ', weighted to the official domain percentages, ' + cap.minutes + '-minute timer' : '') + '. No hints or explanations until the end. You need <b>over ' + PASS + '%</b> (' + Math.floor(n * PASS / 100 + 1) + '/' + n + ' or better).</p>' +
      (x.passed ? '<p class="chip ok">Already passed — best ' + x.best + '%. Retakes keep your best.</p>' : '') +
      '<p class="muted small">Attempts: ' + x.attempts + (x.best ? ' · best ' + x.best + '%' : '') + '</p>' +
      '<button class="btn pri" id="go">Start ' + (cap ? 'exam' : 'gate test') + '</button></div>' +
      (x.passed ? '<div class="panel" style="margin-top:12px"><div class="tag">Checkpoint phrase for this step</div><div class="code" style="margin-top:8px">' + esc(s.code) + '</div></div>' : '');
    $('#go', p).onclick = function () { runTest(p, s, buildSet(s, n), cap); };
  }
  function buildSet(s, n) {
    if (s.capstone) {
      var pool = [];
      STAGES.forEach(function (o) { if (o.idx <= s.idx && o.tier !== 'pro') o.qs.forEach(function (q) { if (q.d) pool.push(q); }); });
      var W = C.weights, out = [];
      var counts = {}, tot = 0;
      Object.keys(W).forEach(function (d) { counts[d] = Math.round(n * W[d] / 100); tot += counts[d]; });
      var dk = Object.keys(W).sort(function (a, b) { return W[b] - W[a]; }), k = 0;
      while (tot !== n) { counts[dk[k % dk.length]] += tot < n ? 1 : -1; tot += tot < n ? 1 : -1; k++; }
      Object.keys(counts).forEach(function (d) {
        var dp = shuffle(pool.filter(function (q) { return String(q.d) === d; }));
        out = out.concat(dp.slice(0, counts[d]));
      });
      if (out.length < n) out = out.concat(shuffle(pool.filter(function (q) { return out.indexOf(q) < 0; })).slice(0, n - out.length));
      return shuffle(out).map(prep);
    }
    return shuffle(s.qs).slice(0, n).map(prep);
  }
  function runTest(p, s, set, cap) {
    var i = 0, answers = [], t0 = Date.now(), timerId = null, limit = cap ? cap.minutes * 60 : 0;
    function tick() {
      var el = $('#tm', p); if (!el) return;
      var left = limit - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0) { finish(); return; }
      el.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    }
    if (cap) { timerId = setInterval(tick, 1000); cleanup = function () { clearInterval(timerId); }; }
    function show() {
      if (i >= set.length) return finish();
      var q = set[i];
      p.innerHTML = '<div class="qmeta"><span>' + (cap ? 'CAPSTONE' : 'GATE') + ' · Q' + (i + 1) + '/' + set.length + (q.d && C.domains ? ' · D' + q.d : '') + '</span>' + (cap ? '<span class="timer" id="tm"></span>' : '') + '</div>' +
        '<div class="bar" style="margin-bottom:12px"><i style="width:' + (100 * i / set.length) + '%"></i></div><div class="panel" id="qp">' + renderQ(q) + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="quit">Abandon test</button></div>';
      if (cap) tick();
      $('#quit', p).onclick = function () { if (confirm('Abandon this attempt? It counts as an attempt but not a score.')) { st(s.id).attempts++; persist(); if (timerId) clearInterval(timerId); route(); } };
      wire($('#qp', p), q, function (ok, picked) {
        answers.push({ ok: ok, picked: picked });
        if (!q.input) { var b = $('#qp', p).querySelector('[data-c="' + picked + '"]'); if (b) b.classList.add('sel'); }
        setTimeout(function () { i++; show(); }, q.input ? 150 : 220);
      }, false);
    }
    function finish() {
      if (timerId) clearInterval(timerId);
      while (answers.length < set.length) answers.push({ ok: false, picked: null, timeout: true });
      var right = answers.filter(function (a) { return a.ok; }).length, pct = Math.round(1000 * right / set.length) / 10;
      var x = st(s.id), passed = pct > PASS, first = passed && !x.passed;
      x.attempts++; x.best = Math.max(x.best || 0, pct);
      if (passed) x.passed = true;
      S.history.push({ stage: s.id, pct: pct, at: Date.now() });
      if (cap) {
        var byD = {}; set.forEach(function (q, k) { var d = q.d || 0; byD[d] = byD[d] || [0, 0]; byD[d][1]++; if (answers[k].ok) byD[d][0]++; });
      }
      persist(); topbar();
      var next = STAGES[s.idx + 1];
      var h = '<div class="panel center"><div class="tag">' + (passed ? 'PASSED' : 'NOT YET') + '</div><div class="big" style="color:' + (passed ? 'var(--ok)' : 'var(--bad)') + '">' + pct + '%</div>' +
        '<p>' + right + '/' + set.length + ' correct · needed over ' + PASS + '%</p>';
      if (passed) h += '<p class="muted">Write down your checkpoint phrase. Typing it into <b>Save → Restore</b> on any device puts you right back here.</p><div class="code" id="cp">' + esc(s.code) + '</div>' +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="cpy">Copy phrase</button>' + (next ? '<button class="btn pri" data-go="#stage/' + next.id + '">Unlocked: ' + esc(next.title) + ' →</button>' : '') + '</div>';
      else h += '<p class="muted">Review every miss below, drill the cards, and use Practice → Missed only. Then retake — the questions reshuffle.</p>';
      h += '</div>';
      if (cap && byD) h += '<div class="panel" style="margin-top:12px"><h3>By domain</h3>' + Object.keys(byD).map(function (d) { var v = byD[d], pc = Math.round(100 * v[0] / v[1]); return '<div class="row small" style="margin:6px 0"><span style="flex:0 0 52%">' + esc(C.domains[d] || 'Other') + '</span><div class="bar grow"><i style="width:' + pc + '%;background:' + (pc > PASS ? 'var(--ok)' : pc >= 75 ? 'var(--lock)' : 'var(--bad)') + '"></i></div><span class="mono">' + pc + '%</span></div>'; }).join('') + '</div>';
      h += '<h3 style="margin-top:18px">Review</h3><div class="stack">';
      set.forEach(function (q, k) {
        var a = answers[k];
        var yours = a.timeout ? '(time ran out)' : q.input ? a.picked : (a.picked != null ? q.c[a.picked] : '');
        if (!a.ok && !q.gen) { var oi = s.qs.indexOf(q); }
        h += '<div class="panel tight"><div class="small muted">Q' + (k + 1) + ' · ' + (a.ok ? '<span style="color:var(--ok)">correct</span>' : '<span style="color:var(--bad)">missed</span>') + '</div><div class="q" style="font-size:.95rem">' + (q.html ? q.q : esc(q.q)) + '</div>' +
          (!a.ok ? '<div class="small">You: <code>' + esc(yours) + '</code></div>' : '') + explainHtml(q, a.ok) + '</div>';
      });
      h += '</div>';
      p.innerHTML = h;
      var cp = $('#cpy', p); if (cp) cp.onclick = function () { copy(s.code); };
      if (first) toast('🔓 ' + (next ? next.title + ' unlocked' : 'Path complete!'), 3000);
    }
    show();
  }

  // ---------- LABS ----------
  function pLabs(p, s) {
    p.innerHTML = '<div class="list">' + (s.labs || []).map(function (id) {
      var L = C.labs[id], ok = st(s.id).labs[id];
      return '<button class="li" data-go="#lab/' + id + '"><span class="chip ' + (ok ? 'ok' : '') + '">' + (ok ? '✓' : 'LAB') + '</span><span class="grow"><b>' + esc(L.title) + '</b><div class="s">' + esc(L.sum || '') + '</div></span><span class="muted">›</span></button>';
    }).join('') + '</div>';
  }
  function labStage(id) { return STAGES.filter(function (s) { return (s.labs || []).indexOf(id) >= 0; })[0]; }
  function vLabs(m) {
    var h = '<h1>Labs</h1><p class="muted">Every lab from steps you have unlocked. Labs stay open for practice after you pass.</p>';
    STAGES.forEach(function (s) {
      if (!(s.labs || []).length) return;
      var un = unlocked(s);
      h += '<div class="tier"><h3>' + (s.idx + 1) + '. ' + esc(s.title) + '</h3>' + (un ? '' : '<span class="chip lock">🔒</span>') + '</div><div class="list">';
      s.labs.forEach(function (id) {
        var L = C.labs[id], ok = st(s.id).labs[id];
        h += '<button class="li" ' + (un ? 'data-go="#lab/' + id + '"' : 'disabled style="opacity:.5"') + '><span class="chip ' + (ok ? 'ok' : '') + '">' + (ok ? '✓' : 'LAB') + '</span><span class="grow"><b>' + esc(L.title) + '</b><div class="s">' + esc(L.sum || '') + '</div></span></button>';
      });
      h += '</div>';
    });
    m.innerHTML = h;
  }
  function vLab(m, args) {
    var id = args[0], L = C.labs[id], s = labStage(id);
    if (!L || !s || !unlocked(s)) { location.hash = '#labs'; return; }
    var kind = window.LAB_KINDS && window.LAB_KINDS[L.kind || 'net'];
    var api = {
      lite: S.device === 'phone',
      load: function () { return load(C.id + ':lab:' + id, null); },
      save: function (v) { save(C.id + ':lab:' + id, v); },
      clear: function () { try { localStorage.removeItem(C.id + ':lab:' + id); } catch (e) { } },
      complete: function () {
        if (!st(s.id).labs[id]) { st(s.id).labs[id] = true; persist(); toast('✓ Lab complete: ' + esc(L.title), 2600); }
      },
      done: function () { return !!st(s.id).labs[id]; },
      back: '#stage/' + s.id + '/labs',
      esc: esc, modal: modal, toast: toast,
      setCleanup: function (f) { cleanup = f; }
    };
    kind.render(m, L, api);
  }

  // ---------- CARDS (global) ----------
  function vCards(m) {
    var open = STAGES.filter(unlocked), all = [];
    open.forEach(function (s) { all = all.concat(s.cards); });
    var due = dueCards(all).length;
    m.innerHTML = '<h1>Flashcards</h1><p class="muted">Spaced repetition across every unlocked step. ' + due + ' due now of ' + all.length + '.</p>' +
      '<div class="row" style="margin-bottom:12px"><button class="btn pri" id="all">Review all due</button></div><div class="list">' +
      open.map(function (s) { return '<button class="li" data-st="' + s.id + '"><span class="grow"><b>' + (s.idx + 1) + '. ' + esc(s.title) + '</b><div class="s">' + dueCards(s.cards).length + ' due · ' + s.cards.length + ' cards</div></span><span class="muted">›</span></button>'; }).join('') + '</div><div id="pane"></div>';
    $('#all', m).onclick = function () { var p = document.createElement('div'); m.innerHTML = ''; m.appendChild(p); cardSession(p, all, 'All decks'); };
    m.querySelectorAll('[data-st]').forEach(function (b) { b.onclick = function () { location.hash = '#stage/' + b.dataset.st + '/cards'; }; });
  }

  // ---------- TOOLS ----------
  function vTools(m) {
    m.innerHTML = '<h1>Tools & drills</h1><p class="muted">Endless, randomly generated practice. Use them any time — they never run out.</p><div class="list">' +
      (C.tools || []).map(function (t) { return '<button class="li" data-go="#tool/' + t.id + '"><span class="grow"><b>' + esc(t.title) + '</b><div class="s">' + esc(t.desc) + '</div></span><span class="muted">›</span></button>'; }).join('') + '</div>';
  }
  function vTool(m, args) {
    var t = (C.tools || []).filter(function (x) { return x.id === args[0]; })[0];
    if (!t) return vTools(m);
    m.innerHTML = '<div class="row" style="margin-bottom:8px"><button class="btn sm ghost" data-go="#tools">← Tools</button></div><h1>' + esc(t.title) + '</h1><div id="tool"></div>';
    t.render($('#tool', m), { esc: esc, shuffle: shuffle, toast: toast, gens: C.gens, renderQ: renderQ, wire: wire, prep: prep, setCleanup: function (f) { cleanup = f; } });
  }

  // ---------- SAVE / CODES ----------
  function normCode(c) { return String(c).toUpperCase().replace(/[^A-Z0-9]+/g, ''); }
  function restoreTo(s) {
    STAGES.forEach(function (o) {
      if (o.idx <= s.idx) { var x = st(o.id); x.lesson = true; (o.labs || []).forEach(function (l) { x.labs[l] = true; }); if (!x.passed) { x.passed = true; x.best = Math.max(x.best || 0, PASS + 1); x.restored = true; } }
    });
    persist();
  }
  function vCodes(m) {
    var earned = STAGES.filter(function (s) { return st(s.id).passed; });
    var hist = S.history.slice(-8).reverse();
    m.innerHTML = '<h1>Save & restore</h1>' +
      '<div class="panel"><h3>Restore from a checkpoint phrase</h3><p class="muted small">Lost your progress or switched devices? Type the phrase from the last step you passed. Every step up to it unlocks.</p>' +
      '<div class="row"><input class="answer-in grow" id="rc" placeholder="e.g. ' + esc(C.codeExample || 'PHRASE-HERE') + '" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn pri" id="rb">Restore</button></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Your checkpoint phrases</h3>' +
      (earned.length ? '<div class="list">' + earned.map(function (s) { return '<div class="li" style="cursor:default"><span class="chip ok">' + (s.idx + 1) + '</span><span class="grow"><b>' + esc(s.title) + '</b><div class="mono small" style="color:var(--acc);margin-top:2px">' + esc(s.code) + '</div></span><button class="btn sm" data-cp="' + esc(s.code) + '">Copy</button></div>'; }).join('') + '</div>' +
        '<p class="muted small" style="margin-top:10px">Only your latest phrase matters — it restores everything before it.</p>' : '<p class="muted">Pass your first gate test to earn a phrase.</p>') + '</div>' +
      '<div class="panel" style="margin-top:12px"><h3>Backup file</h3><p class="muted small">Exports everything — card schedules, missed questions, lab configs. Use it to move between iPhone and laptop with full detail.</p>' +
      '<div class="row"><button class="btn" id="ex">Export backup</button><label class="btn">Import backup<input type="file" id="im" accept=".json,application/json" hidden></label></div></div>' +
      '<div class="panel" style="margin-top:12px"><h3>Device mode</h3><p class="muted small">Currently: <b>' + (S.device === 'phone' ? 'Phone (lite)' : 'Laptop (full)') + '</b></p><button class="btn" id="dev">Switch device mode</button></div>' +
      (hist.length ? '<div class="panel" style="margin-top:12px"><h3>Recent tests</h3>' + hist.map(function (h) { var s = stageById(h.stage); return '<div class="row small" style="margin:4px 0"><span class="grow">' + esc(s ? s.title : h.stage) + '</span><span class="mono" style="color:' + (h.pct > PASS ? 'var(--ok)' : 'var(--bad)') + '">' + h.pct + '%</span><span class="dim">' + new Date(h.at).toLocaleDateString() + '</span></div>'; }).join('') + '</div>' : '') +
      '<div class="panel" style="margin-top:12px"><h3>Danger zone</h3><button class="btn warn" id="rs">Reset all progress</button></div>';
    $('#rb', m).onclick = function () {
      var v = normCode($('#rc', m).value);
      var s = STAGES.filter(function (x) { return normCode(x.code) === v; })[0];
      if (!s) { toast('That phrase does not match any step. Check spelling.'); return; }
      restoreTo(s); toast('✓ Restored through step ' + (s.idx + 1) + ': ' + esc(s.title), 3000); route();
    };
    m.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { copy(b.dataset.cp); }; });
    $('#ex', m).onclick = function () {
      var labs = {}; try { for (var k = 0; k < localStorage.length; k++) { var key = localStorage.key(k); if (key.indexOf(C.id + ':lab:') === 0) labs[key] = localStorage.getItem(key); } } catch (e) { }
      var blob = new Blob([JSON.stringify({ course: C.id, at: Date.now(), state: S, labs: labs })], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = C.id + '-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    $('#im', m).onchange = function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var d = JSON.parse(r.result);
          if (d.course !== C.id) { toast('That backup belongs to a different course (' + esc(d.course) + ')'); return; }
          var dev = S.device; S = d.state; S.device = dev; persist();
          Object.keys(d.labs || {}).forEach(function (k) { try { localStorage.setItem(k, d.labs[k]); } catch (e) { } });
          toast('✓ Backup imported'); route();
        } catch (err) { toast('Could not read that file'); }
      };
      r.readAsText(f);
    };
    $('#dev', m).onclick = function () { picker(true); };
    $('#rs', m).onclick = function () {
      if (prompt('Type RESET to wipe all progress on this device') === 'RESET') {
        try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(C.id + ':') === 0) localStorage.removeItem(k); }); } catch (e) { }
        var dev = S.device; S = { device: dev, stages: {}, cards: {}, missed: {}, history: [], created: Date.now() }; persist(); route();
      }
    };
  }

  // expose for lab plugins / debugging
  window.ENGINE_Q = { prep: prep, renderQ: renderQ, wire: wire };
  window.ENGINE = { state: function () { return S; }, persist: persist, stages: STAGES, st: st, route: route, esc: esc };

  // ---------- boot ----------
  shell();
  if (!S.device) picker(false); else route();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); });
  }
})();

</script>
</body>
</html>
