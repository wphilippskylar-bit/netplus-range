  S.push({
    id: 's07', tier: 'c', title: 'Switching, VLANs & STP', code: 'NET07-TAGGED-FRAMES',
    goal: 'MAC learning, VLANs, access vs trunk, 802.1Q, native VLAN, STP, link aggregation, PoE.',
    lesson: [
      { h: 'How a switch learns', html: '<p>A switch reads the <b>source MAC</b> of every frame and records "this MAC is on this port" in its <b>MAC (CAM) table</b>. It forwards by <b>destination MAC</b>: known → out one port; unknown unicast, broadcast, multicast → <b>flooded</b> out all ports in that VLAN except the one it came in on.</p>' },
      { h: 'VLANs', html: '<p>A <b>VLAN</b> splits one physical switch into multiple logical switches — separate broadcast domains. Users in VLAN 10 cannot talk to VLAN 20 without a <b>router or Layer 3 switch</b>. Benefits: smaller broadcast domains, security segmentation, organize by role not location.</p>' +
        '<pre>SW1(config)# vlan 10\nSW1(config-vlan)# name SALES\nSW1(config)# interface f0/1\nSW1(config-if)# switchport mode access\nSW1(config-if)# switchport access vlan 10</pre>' },
      { h: 'Access vs trunk', html: '<p><b>Access port</b>: one VLAN, untagged — for hosts. <b>Trunk port</b>: carries many VLANs between switches/routers, adding an <b>802.1Q tag</b> (4 bytes, 12-bit VLAN ID → 4094 VLANs) to each frame. The <b>native VLAN</b> (default 1) crosses the trunk untagged — both ends must agree or traffic leaks between VLANs.</p>' +
        '<pre>SW1(config)# interface g0/1\nSW1(config-if)# switchport mode trunk\nSW1(config-if)# switchport trunk allowed vlan 10,20\nSW1(config-if)# switchport trunk native vlan 999</pre>' +
        '<div class="callout trap"><b class="k">Exam + real-world trap</b>A VLAN must <b>exist</b> on every switch the traffic crosses and be <b>allowed</b> on every trunk. "Works on SW1 but not across to SW2" = VLAN missing on SW2 or pruned from the trunk.</div>' },
      { h: 'Spanning Tree (STP 802.1D / RSTP 802.1w)', html: '<p>Redundant switch links create <b>Layer 2 loops</b> → broadcast storms that take a network down in seconds (Ethernet has no TTL). STP elects a <b>root bridge</b> (lowest bridge ID = priority + MAC), then blocks redundant paths.</p><ul><li>Port roles: <b>root port</b> (best path to root, one per non-root switch), <b>designated</b> (forwarding on each segment), <b>blocked/alternate</b>.</li><li>802.1D states: blocking → listening → learning → forwarding (~30–50 s). <b>RSTP</b> converges in ~1–2 s.</li><li><b>PortFast</b>: skip states on host ports. <b>BPDU Guard</b>: shut a PortFast port if a switch is plugged in. <b>Root Guard</b>: protect root placement.</li></ul>' +
        '<div class="callout pro"><b class="k">Pro insight</b>Always set the root bridge on purpose (lowest priority on your core). Leaving it to chance means some random closet switch with the oldest MAC becomes root and traffic takes silly paths.</div>' },
      { h: 'Link aggregation & more', html: '<ul><li><b>LACP (802.3ad)</b> bundles links into one logical port-channel — more bandwidth + redundancy, STP sees one link.</li><li><b>Port mirroring / SPAN</b>: copies traffic to a monitor port for Wireshark/IDS.</li><li><b>PoE</b>: 802.3af 15.4 W, 802.3at PoE+ 30 W, 802.3bt PoE++ 60/90–100 W (APs, cameras, phones).</li><li><b>Jumbo frames</b> (~9000 MTU) for storage/data center; must be end to end.</li><li><b>Voice VLAN</b>: phone tags voice in one VLAN while the PC behind it uses the access VLAN.</li><li><b>Layer 3 switch</b>: switch with routing + <b>SVIs</b> (<code>interface vlan 10</code>) as gateways.</li></ul>' },
      { h: 'Labs', html: '<p>Lab 1: put ports in VLANs and prove isolation. Lab 2: two switches with a trunk — make VLANs span both.</p>' }
    ],
    cards: [
      ['MAC address table (CAM)', 'Switch table mapping MAC → port, built from SOURCE addresses.'], ['Flooding', 'Sending a frame out all ports in the VLAN (unknown unicast, broadcast, multicast).'],
      ['VLAN', 'Logical broadcast domain on a switch.'], ['Access port', 'Carries one untagged VLAN; for end hosts.'], ['Trunk port', 'Carries multiple VLANs with 802.1Q tags.'],
      ['802.1Q', 'VLAN tagging standard. 4-byte tag, 12-bit VID.'], ['Native VLAN', 'VLAN sent untagged on a trunk. Must match on both ends. Change it from VLAN 1 for security.'],
      ['STP', 'Spanning Tree Protocol 802.1D — prevents Layer 2 loops by blocking redundant links.'], ['RSTP', '802.1w Rapid STP — converges in seconds.'], ['Root bridge', 'Switch with lowest bridge ID (priority + MAC). Center of the STP tree.'],
      ['BPDU', 'Bridge Protocol Data Unit — STP messages between switches.'], ['PortFast', 'Puts host ports straight into forwarding.'], ['BPDU Guard', 'Err-disables a port that receives a BPDU (someone plugged in a switch).'],
      ['Broadcast storm', 'Frames looping endlessly in a Layer 2 loop, consuming all bandwidth.'], ['LACP', '802.3ad/802.1AX — negotiates link aggregation (port-channel/EtherChannel).'],
      ['SPAN / port mirroring', 'Copies traffic from ports/VLANs to a monitor port.'], ['PoE 802.3af', '15.4 W per port.'], ['PoE+ 802.3at', '30 W per port.'], ['PoE++ 802.3bt', '60 W (Type 3) to 90–100 W (Type 4).'],
      ['SVI', 'Switched Virtual Interface — interface vlan N; a Layer 3 gateway on a switch.'], ['Voice VLAN', 'Separate VLAN for IP phones; PC behind phone uses the data VLAN.'], ['VLAN hopping', 'Attack via switch spoofing (DTP) or double tagging (native VLAN).']
    ],
    qs: [
      Q('How does a switch populate its MAC address table?', 'From the source MAC of incoming frames', ['From the destination MAC of incoming frames', 'From ARP replies only', 'From DHCP leases'], 'Learn by source, forward by destination.', 2),
      Q('What does a switch do with a frame whose destination MAC is not in its table?', 'Floods it out all ports in that VLAN except the ingress port', ['Drops it', 'Sends it to the default gateway', 'Returns it to the sender'], 'Unknown unicast flooding.', 2),
      Q('Which standard inserts a 4-byte tag to identify VLANs on a trunk?', '802.1Q', ['802.1X', '802.3af', '802.1D'], '802.1X = port auth, 802.3af = PoE, 802.1D = STP.', 2),
      Q('Hosts in VLAN 20 on SW1 cannot reach VLAN 20 hosts on SW2. VLAN 10 works across the same trunk. Most likely cause?', 'VLAN 20 is not allowed on the trunk or does not exist on SW2', ['Duplex mismatch', 'Wrong default gateway on all hosts', 'STP root bridge is wrong'], 'If one VLAN works and another does not across the same trunk, check "show interfaces trunk" allowed list and "show vlan brief" on both switches.', 5),
      Q('What prevents Layer 2 loops on redundant switch links?', 'Spanning Tree Protocol', ['OSPF', 'VRRP', 'LACP'], 'STP blocks redundant paths. (LACP bundles links but does not prevent loops between separate paths.)', 2),
      Q('How is the STP root bridge chosen?', 'Lowest bridge ID (priority, then MAC address)', ['Highest IP address', 'Most ports', 'First switch powered on'], 'Lower priority wins; tie → lowest MAC.', 2),
      Q('A user plugs a small home switch into an office port and the port shuts down immediately. Which feature did this?', 'BPDU Guard', ['PortFast', 'Root Guard', 'DHCP snooping'], 'BPDU Guard err-disables PortFast ports that receive BPDUs.', 4),
      Q('The whole network crawls; switch CPUs at 100%; every port LED flashing constantly. What is happening?', 'A broadcast storm caused by a Layer 2 loop', ['A DNS outage', 'A duplex mismatch on one port', 'DHCP exhaustion'], 'Classic loop symptom. Find the redundant path without STP (or a misconfigured port) and break it.', 5),
      Q('An access point needs 25 W. Which PoE standard is the minimum?', '802.3at (PoE+)', ['802.3af', '802.3ab', '802.1Q'], 'af = 15.4 W, at = 30 W, bt = 60–100 W.', 2),
      Q('What must match on both ends of an 802.1Q trunk to avoid traffic leaking between VLANs?', 'Native VLAN', ['Port speed only', 'Hostname', 'IP address'], 'Native VLAN mismatch causes untagged frames to land in different VLANs on each side.', 5),
      Q('Which feature copies traffic from a port to another port where a packet analyzer is connected?', 'Port mirroring (SPAN)', ['PoE', 'LACP', 'Trunking'], 'SPAN/RSPAN for monitoring.', 3),
      Q('Two 10 Gbps links between switches should act as one 20 Gbps link with failover. What do you configure?', 'Link aggregation with LACP', ['Spanning tree PortFast', 'A trunk native VLAN', 'Two separate VLANs'], 'LACP port-channel.', 2),
      Q('What is the main benefit of creating VLANs?', 'Smaller broadcast domains and segmentation', ['Higher link speeds', 'Removing the need for IP', 'Eliminating STP'], 'Each VLAN is its own broadcast domain — better performance and security.', 2),
      Q('Hosts in VLAN 10 and VLAN 20 must communicate. What is required?', 'A router or Layer 3 switch (inter-VLAN routing)', ['A trunk only', 'A hub', 'STP'], 'VLANs are separate networks — a Layer 3 device routes between them.', 2),
      Q('Which switch feature lets an IP phone and the PC plugged into it use different VLANs?', 'Voice VLAN', ['Native VLAN', 'Private VLAN', 'Port security'], 'The phone tags voice traffic; data stays in the access VLAN.', 2),
      Q('RSTP\'s main improvement over 802.1D STP is:', 'Much faster convergence', ['It allows loops', 'It runs at Layer 3', 'It replaces VLANs'], '~1–2 s vs 30–50 s.', 2),
      Q('An attacker sends frames with two 802.1Q tags to reach another VLAN. What is this?', 'Double tagging (VLAN hopping)', ['MAC flooding', 'ARP poisoning', 'DHCP starvation'], 'Mitigate by changing the native VLAN to an unused one and tagging it.', 4),
      T('Type the interface command that makes a switch port carry multiple VLANs.', ['switchport mode trunk'], 'switchport mode trunk', 2, 'IOS command'),
      T('Type the interface command that puts an access port in VLAN 30.', ['switchport access vlan 30'], 'switchport access vlan 30 (after switchport mode access).', 2, 'IOS command')
    ],
    labs: ['l-vlans', 'l-trunk']
  });

  S.push({
    id: 's08', tier: 'c', title: 'Routing, NAT & inter-VLAN', code: 'NET08-NEXT-HOP',
    goal: 'Routing tables, static/default routes, dynamic protocols, AD, NAT/PAT, router-on-a-stick, FHRP.',
    lesson: [
      { h: 'The routing table', html: '<p>A router forwards each packet using the <b>longest prefix match</b> — the most specific route wins. Route sources: <b>C</b> connected (any interface that is up with an IP), <b>S</b> static, dynamic (<b>O</b> OSPF, <b>D</b> EIGRP, <b>B</b> BGP, <b>R</b> RIP), and the <b>default route</b> 0.0.0.0/0 ("gateway of last resort").</p><pre>R1# show ip route\nC  192.168.10.0/24 is directly connected, Gi0/0\nS  10.20.0.0/16 [1/0] via 10.0.0.2\nO  172.16.5.0/24 [110/3] via 10.0.0.6, Gi0/1\nS* 0.0.0.0/0 [1/0] via 203.0.113.1</pre><p>The <code>[110/3]</code> is <b>[administrative distance / metric]</b>.</p>' },
      { h: 'Administrative distance (trust)', html: '<p>When two sources offer the same prefix, the lower AD wins.</p><table><tr><th>Source</th><th>AD</th></tr><tr><td>Connected</td><td>0</td></tr><tr><td>Static</td><td>1</td></tr><tr><td>eBGP</td><td>20</td></tr><tr><td>EIGRP (internal)</td><td>90</td></tr><tr><td>OSPF</td><td>110</td></tr><tr><td>IS-IS</td><td>115</td></tr><tr><td>RIP</td><td>120</td></tr><tr><td>iBGP</td><td>200</td></tr></table><p>Within one protocol, the <b>metric</b> decides (OSPF cost, RIP hop count).</p><p><b>Floating static</b>: a static route with a high AD (e.g., 200) that only appears if the dynamic route disappears — a classic backup link.</p>' },
      { h: 'Static & default routes', html: '<pre>R1(config)# ip route 10.20.0.0 255.255.0.0 10.0.0.2\nR1(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1\nR1(config)# ip route 10.20.0.0 255.255.0.0 10.9.9.2 200   ← floating backup</pre><p>Routing is <b>per hop and per direction</b>. Every router needs a route to the destination <i>and</i> the destination side needs a route back. Missing return routes are the #1 static-routing mistake.</p>' },
      { h: 'Dynamic routing protocols', html: '<table><tr><th>Protocol</th><th>Type</th><th>Metric</th><th>Notes</th></tr><tr><td>RIP v2</td><td>Distance vector</td><td>Hop count (max 15)</td><td>Slow, legacy</td></tr><tr><td>OSPF</td><td>Link state</td><td>Cost (bandwidth)</td><td>Open standard, areas (area 0 backbone), fast convergence</td></tr><tr><td>EIGRP</td><td>Advanced distance vector (hybrid)</td><td>Bandwidth + delay</td><td>Cisco origin</td></tr><tr><td>BGP</td><td>Path vector</td><td>Path attributes (AS-path…)</td><td>The Internet. Exterior gateway protocol, TCP 179</td></tr></table><p><b>IGP</b> = inside one organization (OSPF, EIGRP, RIP). <b>EGP</b> = between organizations/autonomous systems (BGP). Link-state routers know the whole map; distance-vector routers only know what neighbors tell them.</p>' },
      { h: 'NAT & PAT', html: '<ul><li><b>Static NAT</b> — one private ↔ one public (publishing a server).</li><li><b>Dynamic NAT</b> — private hosts borrow from a pool of publics.</li><li><b>PAT / NAT overload</b> — many private hosts share one public IP using unique source ports (every home router).</li><li>Terms: inside local (private IP), inside global (public IP it becomes).</li><li><b>Port forwarding</b> — inbound to a public port maps to an inside host:port.</li></ul>' },
      { h: 'Inter-VLAN routing', html: '<p><b>Router-on-a-stick</b>: one router port as an 802.1Q trunk with a subinterface per VLAN:</p><pre>R1(config)# interface g0/0\nR1(config-if)# no shutdown\nR1(config)# interface g0/0.10\nR1(config-subif)# encapsulation dot1Q 10\nR1(config-subif)# ip address 192.168.10.1 255.255.255.0</pre><p>The switch side of that link must be a <b>trunk</b>. At scale you use a <b>Layer 3 switch</b> with SVIs instead.</p>' },
      { h: 'First Hop Redundancy (FHRP)', html: '<p>Hosts have one default gateway. If that router dies, they are stranded. <b>VRRP</b> (open), <b>HSRP</b> (Cisco), and GLBP share a <b>virtual IP + virtual MAC</b> between two routers — one active, one standby. Hosts point at the virtual IP and never notice a failover.</p>' },
      { h: 'Labs', html: '<p>Lab 1: two routers, two LANs — make them talk with static routes (both directions!). Lab 2: router-on-a-stick for two VLANs.</p>' }
    ],
    cards: [
      ['Longest prefix match', 'Router picks the most specific matching route.'], ['Administrative distance', 'Trustworthiness of a route source; lower wins.'], ['AD connected / static', '0 / 1.'], ['AD OSPF', '110.'], ['AD EIGRP', '90.'], ['AD RIP', '120.'], ['AD eBGP / iBGP', '20 / 200.'],
      ['Default route', '0.0.0.0/0 — gateway of last resort.'], ['Floating static route', 'Static route with higher AD so it only installs if the primary route fails.'],
      ['OSPF', 'Link-state IGP, cost metric, areas (area 0 = backbone), AD 110.'], ['RIP', 'Distance-vector IGP, hop count, max 15, AD 120.'], ['EIGRP', 'Advanced distance-vector, bandwidth+delay metric, AD 90.'], ['BGP', 'Path-vector EGP that runs the Internet. TCP 179.'],
      ['IGP vs EGP', 'Interior (within an AS) vs exterior (between ASes).'], ['Autonomous system (AS)', 'A network under one administrative control with one routing policy, identified by an ASN.'],
      ['Static NAT', 'One-to-one private/public mapping.'], ['PAT / NAT overload', 'Many inside hosts share one public IP via port numbers.'], ['Port forwarding', 'Maps an outside port to an inside host:port.'],
      ['Router-on-a-stick', 'One router trunk link with dot1Q subinterfaces routing between VLANs.'], ['FHRP', 'First Hop Redundancy Protocol — virtual gateway IP shared by routers (HSRP, VRRP, GLBP).'], ['VRRP', 'Open-standard FHRP.'], ['HSRP', 'Cisco FHRP; active/standby routers.'],
      ['Convergence', 'Time for all routers to agree on the topology after a change.'], ['TTL', 'IP hop limit decremented by each router; prevents packets looping forever.']
    ],
    qs: [
      Q('A router has routes to 10.0.0.0/8, 10.1.0.0/16 and 10.1.1.0/24. Where does it send a packet for 10.1.1.40?', 'The 10.1.1.0/24 route', ['The 10.0.0.0/8 route', 'The 10.1.0.0/16 route', 'It load balances across all three'], 'Longest prefix match: /24 is most specific.', 1),
      Q('OSPF and EIGRP both learn 172.16.0.0/16. Which goes into the routing table?', 'EIGRP (AD 90)', ['OSPF (AD 110)', 'Both, load balanced', 'Whichever was learned first'], 'Lower AD wins: EIGRP 90 < OSPF 110.', 1),
      Q('You want a backup static route that only takes over if the OSPF route disappears. What do you configure?', 'A floating static route with AD higher than 110', ['A static route with AD 1', 'A second default route with AD 0', 'RIP on the backup link'], 'Floating static: e.g., ip route ... 200. It sits unused until OSPF withdraws.', 2),
      Q('PCs on LAN A can send packets to LAN B (seen in a capture on LAN B), but pings fail. Static routes were configured on R1 only. Likely cause?', 'R2 has no route back to LAN A', ['DNS is broken', 'STP blocked the link', 'The PCs need APIPA'], 'Routing works per direction. The reply needs a return route.', 5),
      Q('Which protocol routes between autonomous systems on the Internet?', 'BGP', ['OSPF', 'RIP', 'EIGRP'], 'BGP is the path-vector EGP of the Internet.', 1),
      Q('Which routing protocol uses hop count and has a maximum of 15 hops?', 'RIP', ['OSPF', 'EIGRP', 'BGP'], '16 = unreachable in RIP.', 1),
      Q('What type of routing protocol builds a full topology map and runs SPF/Dijkstra?', 'Link-state (e.g., OSPF)', ['Distance vector', 'Path vector', 'Static'], 'OSPF/IS-IS are link-state.', 1),
      Q('One public IP is shared by 200 office PCs to reach the Internet. What is this?', 'PAT (NAT overload)', ['Static NAT', 'Port mirroring', 'Anycast'], 'PAT tracks connections by translated source port.', 2),
      Q('An internal web server at 10.1.1.20 must be reachable from the Internet at a fixed public IP. Best choice?', 'Static NAT (or port forwarding) to 10.1.1.20', ['PAT overload', 'APIPA', 'A floating static route'], 'One-to-one mapping for inbound access.', 2),
      Q('Router-on-a-stick: the router subinterfaces are correct but no VLAN can reach its gateway. What should you check on the switch port facing the router?', 'It must be configured as a trunk', ['It must be an access port in VLAN 1', 'It needs PortFast', 'It needs PoE'], 'The router expects tagged frames; an access port strips them.', 5),
      Q('Which command puts a router subinterface in VLAN 30?', 'encapsulation dot1Q 30', ['switchport access vlan 30', 'vlan 30', 'ip vlan 30'], 'Subinterfaces use encapsulation dot1Q <vlan>.', 2),
      Q('Two routers share virtual IP 10.1.1.1. Hosts use it as their gateway. If the active router fails, the standby takes over. What is this?', 'A first hop redundancy protocol (VRRP/HSRP)', ['Link aggregation', 'Spanning tree', 'Route summarization'], 'FHRP provides a resilient default gateway.', 2),
      Q('What prevents an IP packet from circulating forever in a routing loop?', 'The TTL field decremented at each hop', ['The FCS', 'Spanning tree', 'The ARP cache'], 'At TTL 0 the router drops it and sends ICMP Time Exceeded (which traceroute exploits).', 1),
      Q('What does "Gateway of last resort is not set" mean on a router?', 'There is no default route', ['OSPF is down', 'NAT is disabled', 'The router has no interfaces'], 'Without 0.0.0.0/0, packets to unknown networks are dropped.', 5),
      Q('In show ip route, what does [110/20] mean?', 'Administrative distance 110, metric 20', ['Metric 110, AD 20', '110 hops, 20 ms', 'VLAN 110, cost 20'], '[AD/metric].', 3),
      Q('A Layer 3 switch routes between VLANs using which kind of interface?', 'SVIs (interface vlan N)', ['Subinterfaces on a hub', 'Loopbacks only', 'Console ports'], 'Each SVI is the gateway for its VLAN.', 2),
      T('Type the command for a default route pointing to next hop 203.0.113.1.', ['ip route 0.0.0.0 0.0.0.0 203.0.113.1'], 'ip route 0.0.0.0 0.0.0.0 203.0.113.1', 2, 'IOS global config command'),
      T('What is the administrative distance of OSPF? (number)', ['110'], 'OSPF = 110.', 1)
    ],
    labs: ['l-static', 'l-roas']
  });

  S.push({
    id: 's09', tier: 'c', title: 'IPv6', code: 'NET09-HEX-HORIZON',
    goal: 'Read, shorten and classify IPv6 addresses; SLAAC, NDP, dual stack and tunneling.',
    lesson: [
      { h: 'Format', html: '<p>128 bits, written as eight 16-bit groups in hex: <code>2001:0db8:0000:0000:0000:ff00:0042:8329</code>. Shorten: drop leading zeros in each group → <code>2001:db8:0:0:0:ff00:42:8329</code>; replace <b>one</b> run of all-zero groups with <code>::</code> → <code>2001:db8::ff00:42:8329</code>. Standard subnet = <b>/64</b> (64-bit network prefix + 64-bit interface ID).</p>' },
      { h: 'Address types', html: '<table><tr><th>Prefix</th><th>Type</th><th>IPv4 cousin</th></tr><tr><td>2000::/3</td><td>Global unicast (GUA)</td><td>Public</td></tr><tr><td>fc00::/7 (fd00::/8 in use)</td><td>Unique local (ULA)</td><td>RFC 1918 private</td></tr><tr><td>fe80::/10</td><td>Link-local — every interface has one, not routed</td><td>APIPA (but always present)</td></tr><tr><td>ff00::/8</td><td>Multicast (ff02::1 all nodes, ff02::2 all routers)</td><td>Broadcast/multicast</td></tr><tr><td>::1/128</td><td>Loopback</td><td>127.0.0.1</td></tr><tr><td>::/128</td><td>Unspecified</td><td>0.0.0.0</td></tr></table><p>No broadcast in IPv6. Anycast exists.</p>' },
      { h: 'Getting an address', html: '<ul><li><b>SLAAC</b> — host hears a <b>Router Advertisement</b>, takes the /64 prefix and builds its own interface ID (EUI-64 from the MAC, or random for privacy).</li><li><b>DHCPv6</b> — stateful (server assigns) or stateless (SLAAC address + DHCPv6 for DNS options).</li><li><b>EUI-64</b>: split the 48-bit MAC, insert <code>FFFE</code> in the middle, flip the 7th bit.</li></ul>' },
      { h: 'NDP replaces ARP', html: '<p><b>Neighbor Discovery Protocol</b> (ICMPv6): Neighbor Solicitation/Advertisement (like ARP), Router Solicitation/Advertisement (find routers + prefix), <b>DAD</b> duplicate address detection, redirects.</p>' },
      { h: 'Transition', html: '<ul><li><b>Dual stack</b> — run IPv4 and IPv6 side by side (most common, preferred).</li><li><b>Tunneling</b> — carry IPv6 inside IPv4: 6to4, ISATAP, Teredo (through NAT), GRE.</li><li><b>NAT64/DNS64</b> — v6-only clients reach v4 servers.</li></ul>' +
        '<div class="callout pro"><b class="k">Pro insight</b>Even "IPv4-only" networks have IPv6 link-local enabled on every Windows/Mac/Linux host. Attackers use rogue RAs (fake routers) to MITM networks that forgot IPv6 exists. RA Guard on switches fixes that.</div>' }
    ],
    cards: [
      ['IPv6 length', '128 bits, 8 groups of 4 hex digits.'], ['Double colon ::', 'Replaces one contiguous run of zero groups; only once per address.'], ['Global unicast', '2000::/3 — publicly routable.'], ['Link-local', 'fe80::/10 — auto-configured on every interface; not routed.'],
      ['Unique local', 'fc00::/7 (fd00::/8) — private IPv6.'], ['IPv6 multicast', 'ff00::/8. ff02::1 all nodes, ff02::2 all routers.'], ['IPv6 loopback', '::1'], ['SLAAC', 'Stateless address autoconfiguration from Router Advertisements.'],
      ['EUI-64', 'Builds a 64-bit interface ID from a MAC by inserting FFFE and flipping the 7th bit.'], ['NDP', 'Neighbor Discovery Protocol (ICMPv6) — replaces ARP; RS/RA/NS/NA, DAD.'], ['Dual stack', 'Running IPv4 and IPv6 simultaneously.'], ['Teredo', 'Tunnels IPv6 over UDP/IPv4 through NAT.'], ['DHCPv6', 'Stateful or stateless IPv6 configuration server.'], ['Standard IPv6 LAN prefix', '/64']
    ],
    qs: [
      { gen: 'v6', d: 1 }, { gen: 'v6', d: 1 },
      Q('Which IPv6 prefix is link-local?', 'fe80::/10', ['2000::/3', 'fc00::/7', 'ff00::/8'], 'fe80::/10 exists on every IPv6 interface and is never routed.', 1),
      Q('Which IPv6 type is the equivalent of RFC 1918 private addressing?', 'Unique local (fc00::/7)', ['Link-local', 'Global unicast', 'Multicast'], 'ULA (practically fd00::/8).', 1),
      Q('What replaces ARP in IPv6?', 'Neighbor Discovery Protocol (ICMPv6)', ['DHCPv6', 'RARP', 'IGMP'], 'NDP Neighbor Solicitation/Advertisement.', 1),
      Q('Which is a valid shortening of 2001:0db8:0000:0000:0001:0000:0000:0001?', '2001:db8::1:0:0:1', ['2001:db8::1::1', '2001:db8:0:1::1:1', '2001:db8::1'], 'Only ONE :: allowed. The two zero runs are equal length — compress the first.', 1),
      Q('A host configures its own IPv6 address from a router advertisement without a DHCP server. This is:', 'SLAAC', ['APIPA', 'Stateful DHCPv6', 'EUI-48'], 'Stateless Address Autoconfiguration.', 1),
      Q('IPv6 does NOT support which address type?', 'Broadcast', ['Multicast', 'Anycast', 'Unicast'], 'Broadcast is gone; multicast covers it.', 1),
      Q('What is the IPv6 loopback address?', '::1', ['fe80::1', '::', 'ff02::1'], '::1/128.', 1),
      Q('Which transition method runs both protocols on every device at once?', 'Dual stack', ['Teredo', 'NAT64', '6to4'], 'Dual stack is the most common migration approach.', 2),
      Q('A Windows host behind a home NAT tunnels IPv6 over UDP/IPv4. Which technology?', 'Teredo', ['ISATAP', 'Dual stack', 'NAT overload'], 'Teredo was built for NAT traversal.', 1),
      Q('Which multicast address reaches all IPv6 routers on the link?', 'ff02::2', ['ff02::1', 'fe80::2', '::2'], 'ff02::1 all nodes, ff02::2 all routers.', 1),
      Q('How many bits is the interface ID in a standard /64 IPv6 subnet?', '64', ['48', '32', '80'], '64 network + 64 host.', 1),
      Q('Which process confirms an IPv6 address is not already in use before assigning it?', 'Duplicate Address Detection (DAD)', ['Router Advertisement', 'EUI-64', 'ARP probe'], 'DAD uses Neighbor Solicitations.', 1),
      T('Type the IPv6 loopback address.', ['::1'], '::1', 1)
    ],
    labs: ['d-v6']
  });

  S.push({
    id: 's10', tier: 'c', title: 'Wireless networking', code: 'NET10-RADIO-WAVES',
    goal: '802.11 standards, bands, channels, antennas, security, site surveys, and Wi-Fi troubleshooting.',
    lesson: [
      { h: 'Standards', html: '<table><tr><th>Standard</th><th>Name</th><th>Band</th><th>Max</th></tr><tr><td>802.11a</td><td></td><td>5 GHz</td><td>54 Mbps</td></tr><tr><td>802.11b</td><td></td><td>2.4 GHz</td><td>11 Mbps</td></tr><tr><td>802.11g</td><td></td><td>2.4 GHz</td><td>54 Mbps</td></tr><tr><td>802.11n</td><td>Wi-Fi 4</td><td>2.4/5</td><td>600 Mbps (MIMO, 40 MHz)</td></tr><tr><td>802.11ac</td><td>Wi-Fi 5</td><td>5</td><td>~6.9 Gbps (MU-MIMO down, 160 MHz)</td></tr><tr><td>802.11ax</td><td>Wi-Fi 6 / 6E</td><td>2.4/5 (+6 GHz for 6E)</td><td>~9.6 Gbps (OFDMA, BSS coloring, TWT)</td></tr><tr><td>802.11be</td><td>Wi-Fi 7</td><td>2.4/5/6</td><td>~46 Gbps (320 MHz, MLO)</td></tr></table>' },
      { h: 'Bands & channels', html: '<ul><li><b>2.4 GHz</b>: longer range, better wall penetration, crowded, only <b>3 non-overlapping channels: 1, 6, 11</b> (US). Microwaves and Bluetooth interfere.</li><li><b>5 GHz</b>: many more channels, faster, shorter range. <b>DFS</b> channels must avoid radar.</li><li><b>6 GHz</b>: huge clean spectrum, Wi-Fi 6E/7 only, shortest range.</li><li>Wider channels (40/80/160 MHz) = more speed but fewer non-overlapping channels.</li></ul>' },
      { h: 'Terms', html: '<ul><li><b>SSID</b> — network name. <b>BSSID</b> — the AP radio\'s MAC. <b>ESSID/ESS</b> — same SSID across many APs for roaming.</li><li><b>Infrastructure</b> mode (AP) vs <b>ad hoc</b> (client-to-client) vs <b>mesh</b> (APs backhaul wirelessly).</li><li><b>Autonomous/fat AP</b> vs <b>lightweight AP + wireless LAN controller (WLC)</b> vs cloud-managed.</li><li>Antennas: <b>omnidirectional</b> (360°) vs <b>directional</b> (Yagi, parabolic, patch — point-to-point links).</li><li><b>RSSI</b> (dBm, −30 great, −67 good for voice, −80 bad), <b>SNR</b>, <b>EIRP</b> (transmit power incl. antenna gain).</li></ul>' },
      { h: 'Security', html: '<table><tr><th>Method</th><th>Status</th></tr><tr><td>WEP</td><td>Broken (RC4, weak IVs)</td></tr><tr><td>WPA (TKIP)</td><td>Deprecated</td></tr><tr><td>WPA2-Personal (PSK, AES-CCMP)</td><td>OK, vulnerable to offline PSK cracking if weak</td></tr><tr><td>WPA2/3-Enterprise (802.1X + RADIUS, EAP)</td><td>Business standard — per-user credentials/certs</td></tr><tr><td>WPA3-Personal (SAE)</td><td>Best for PSK networks — resists offline dictionary attacks</td></tr></table><p>Also: <b>captive portals</b> for guests, <b>MAC filtering</b> (weak, easily spoofed), <b>guest network isolation</b>, disabling WPS.</p>' },
      { h: 'Site surveys & troubleshooting', html: '<p>A <b>site survey</b> (predictive and/or on-site) maps coverage with a <b>heat map</b>. Common problems:</p><ul><li><b>Co-channel / adjacent channel interference</b> — APs on the same/overlapping channels.</li><li><b>Low RSSI / dead zones</b> — distance, walls, metal, water, elevator shafts.</li><li><b>Sticky clients</b> — device clings to a far AP; tune minimum RSSI / band steering.</li><li><b>Wrong passphrase / wrong SSID / incompatible security</b> — client cannot authenticate.</li><li><b>Channel overlap and power set too high</b> — more power is not always better.</li><li>Antenna placement and polarization.</li></ul>' }
    ],
    cards: [
      ['2.4 GHz non-overlapping channels (US)', '1, 6, 11'], ['Wi-Fi 4', '802.11n'], ['Wi-Fi 5', '802.11ac (5 GHz)'], ['Wi-Fi 6 / 6E', '802.11ax; 6E adds 6 GHz'], ['Wi-Fi 7', '802.11be'],
      ['SSID', 'Wireless network name.'], ['BSSID', 'MAC address of an AP radio.'], ['ESS', 'Extended service set — multiple APs sharing one SSID for roaming.'], ['WLC', 'Wireless LAN controller that centrally manages lightweight APs.'],

(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE;

  S.push({
    id: 's11', tier: 'c', title: 'DNS, DHCP, cloud & data center', code: 'NET11-LEASE-AND-NAME',
    goal: 'DHCP DORA, scopes and relays; DNS records and resolution; SDN, SD-WAN, cloud models and data center design.',
    lesson: [
      { h: 'DHCP — DORA', html: '<p><b>D</b>iscover (client broadcast) → <b>O</b>ffer (server) → <b>R</b>equest (client) → <b>A</b>cknowledge (server). UDP 67 server / 68 client. A <b>scope</b> = pool of addresses + options (gateway, DNS, lease time). <b>Exclusions</b> keep static devices out of the pool; <b>reservations</b> give a specific MAC the same IP every time. Clients renew at 50% (T1) and 87.5% (T2) of the lease.</p>' +
        '<p>DHCP Discover is a <b>broadcast</b>, and routers do not forward broadcasts. To serve other subnets, the router interface on that subnet needs a <b>DHCP relay / IP helper</b>:</p><pre>R1(config)# interface g0/1\nR1(config-if)# ip helper-address 10.50.0.10</pre>' +
        '<pre>R1(config)# ip dhcp excluded-address 192.168.10.1 192.168.10.9\nR1(config)# ip dhcp pool LAN10\nR1(dhcp-config)# network 192.168.10.0 255.255.255.0\nR1(dhcp-config)# default-router 192.168.10.1\nR1(dhcp-config)# dns-server 10.50.0.53</pre>' },
      { h: 'DNS', html: '<table><tr><th>Record</th><th>Purpose</th></tr><tr><td>A / AAAA</td><td>Name → IPv4 / IPv6</td></tr><tr><td>CNAME</td><td>Alias → another name</td></tr><tr><td>MX</td><td>Mail server for the domain (with priority)</td></tr><tr><td>PTR</td><td>Reverse lookup: IP → name</td></tr><tr><td>NS</td><td>Authoritative name servers for the zone</td></tr><tr><td>SOA</td><td>Start of authority: primary server, serial, timers</td></tr><tr><td>TXT</td><td>Free text — SPF, DKIM, DMARC, domain verification</td></tr><tr><td>SRV</td><td>Service location (host + port), e.g., AD/_ldap, SIP</td></tr></table>' +
        '<p><b>Recursive</b> resolver does the work for the client; <b>iterative</b> queries go root → TLD → authoritative. <b>TTL</b> controls caching. <b>Primary/secondary</b> zones replicate via zone transfer. <b>DNSSEC</b> signs records against spoofing; <b>DoH/DoT</b> encrypt queries (443/853). Local <b>hosts</b> file is checked before DNS.</p>' +
        '<div class="callout pro"><b class="k">Pro insight</b>"It\'s always DNS." When an app breaks after a migration, check TTLs that were never lowered before the cutover, stale CNAMEs, and split-horizon DNS returning internal answers to external users.</div>' },
      { h: 'Other services', html: '<ul><li><b>NTP</b> — stratum 0 (atomic/GPS) → stratum 1 servers → … Lower stratum = closer to the source.</li><li><b>IPAM</b> — IP address management (tracks subnets, DHCP, DNS together).</li><li><b>Proxy</b> — forward proxy for clients (filtering/caching), reverse proxy in front of servers.</li><li><b>Load balancer</b> — spreads traffic across servers, health checks, SSL offload.</li></ul>' },
      { h: 'Cloud', html: '<ul><li>Service models: <b>IaaS</b> (you manage OS up — VMs), <b>PaaS</b> (you manage app + data — platforms), <b>SaaS</b> (you just use it — M365).</li><li>Deployment: <b>public, private, hybrid, community</b>.</li><li>Connectivity: site-to-site VPN, or a <b>private direct connection</b> (AWS Direct Connect, Azure ExpressRoute).</li><li>Cloud networking: <b>VPC/VNet</b>, subnets, <b>security groups</b> (stateful, instance-level) vs <b>network ACLs</b> (stateless, subnet-level), internet gateway, NAT gateway.</li><li><b>Elasticity</b> (scale automatically with demand) vs <b>scalability</b> (ability to grow). <b>Multitenancy</b>: many customers share hardware.</li></ul>' },
      { h: 'Modern network architecture', html: '<ul><li><b>SDN</b> — separates the <b>control plane</b> (decides where traffic goes) from the <b>data plane</b> (forwards it), with a central controller. Management plane = how you configure it. Northbound APIs to apps, southbound to devices.</li><li><b>SD-WAN</b> — policy-driven WAN over any transport (broadband, LTE, MPLS), application-aware routing, central management, zero-touch provisioning.</li><li><b>VXLAN</b> — Layer 2 over Layer 3 overlay (24-bit VNI → 16 million segments).</li><li><b>Zero Trust Architecture</b> — never trust, always verify; policy-based authentication for every flow.</li><li><b>SASE / SSE</b> — security delivered from the cloud combined with SD-WAN.</li><li><b>Infrastructure as Code (IaC)</b> — network config defined in files (Ansible, Terraform), version controlled.</li></ul>' },
      { h: 'Data center design', html: '<ul><li><b>Three-tier</b>: core → distribution/aggregation → access. Classic campus.</li><li><b>Collapsed core</b>: core + distribution combined (smaller sites).</li><li><b>Spine-leaf</b>: every leaf connects to every spine; any server is ≤2 hops from any other; great for <b>east-west</b> traffic (server-to-server). <b>North-south</b> = traffic entering/leaving the data center.</li><li><b>Top-of-rack</b> switching. <b>Branch office</b> vs <b>on-premises</b> vs <b>colocation</b>.</li><li>Storage: <b>Fibre Channel</b>, <b>FCoE</b>, <b>iSCSI</b> (SCSI over IP), <b>NAS</b> (file-level) vs <b>SAN</b> (block-level).</li></ul>' }
    ],

      ['DHCP relay / ip helper-address', 'Forwards DHCP broadcasts as unicast to a server on another subnet.'], ['Lease T1 / T2', 'Renew at 50%, rebind at 87.5% of lease time.'],

      ['SDN', 'Separates control plane from data plane with a central controller.'], ['Control plane', 'Routing decisions/protocols.'], ['Data plane', 'Actual packet forwarding.'], ['SD-WAN', 'Software-defined WAN: app-aware routing over mixed transports.'], ['VXLAN', 'Layer 2 overlay over Layer 3; 24-bit VNI.'],

    qs: [
      Q('Clients on VLAN 30 get APIPA addresses. The DHCP server is on VLAN 50 and has a scope for VLAN 30. What is missing?', 'An ip helper-address (DHCP relay) on the VLAN 30 gateway interface', ['A DNS PTR record', 'A trunk to the DHCP server', 'A larger lease time'], 'Discover is a broadcast and dies at the router without a relay.', 5),

  S.push({
    id: 's12', tier: 'c', title: 'Network operations', code: 'NET12-STEADY-STATE',
    goal: 'Monitoring, logs, documentation, change management, DR/HA, QoS and performance metrics.',
    lesson: [
      { h: 'Monitoring', html: '<ul><li><b>SNMP</b> polling (161) and traps (162); OIDs in the MIB. Use <b>SNMPv3</b>.</li><li><b>Syslog</b> severity: 0 Emergency, 1 Alert, 2 Critical, 3 Error, 4 Warning, 5 Notice, 6 Informational, 7 Debug. ("Every Awesome Cisco Engineer Will Need Ice cream Daily")</li><li><b>Flow data</b> (NetFlow/IPFIX/sFlow) — who talked to whom, how much. Great for top talkers and security investigations.</li><li><b>SIEM</b> — aggregates and correlates logs; alerts.</li><li><b>Packet capture</b> — full packets (Wireshark/tcpdump) via SPAN or TAP.</li><li><b>Baselines</b> — "normal" so you can spot abnormal. <b>API</b> integrations, <b>port mirroring</b>.</li></ul>' },
      { h: 'Metrics', html: '<ul><li><b>Bandwidth</b> — capacity. <b>Throughput</b> — actual achieved. <b>Goodput</b> — useful application data.</li><li><b>Latency</b> — delay (ms). <b>Jitter</b> — variation in delay (killer for VoIP/video; target &lt;30 ms). <b>Packet loss</b>.</li><li>Interface counters: <b>CRC errors</b> (L1), runts/giants, input/output <b>drops/discards</b> (congestion), <b>utilization</b>.</li><li>Environmental: temperature, humidity, power, fan status.</li></ul>' },
      { h: 'QoS', html: '<p>Classify and mark traffic (<b>DSCP</b> in the IP header — EF 46 for voice; <b>CoS</b> 802.1p in the VLAN tag), then queue/prioritize, police or shape. QoS does not create bandwidth; it decides who suffers during congestion.</p>' },
      { h: 'Documentation', html: '<ul><li><b>Physical diagram</b> (racks, cables, ports) vs <b>logical diagram</b> (subnets, VLANs, routing).</li><li><b>Rack diagram</b>, <b>MDF/IDF</b> docs (main/intermediate distribution frames), cable maps/labels.</li><li><b>Asset inventory</b>, <b>IPAM</b>, warranty/licensing, <b>baseline configs</b> and golden images.</li><li><b>SLA</b> (service level), <b>MOU</b>, <b>NDA</b>, <b>AUP</b>, <b>SOP</b>s.</li><li><b>Change management</b>: request → impact/risk analysis → approval (CAB) → maintenance window → implement → <b>backout plan</b> → document.</li><li>Life cycle: <b>EOL / EOS</b>, patching, firmware, decommissioning (wipe!).</li></ul>' },
      { h: 'High availability & disaster recovery', html: '<ul><li><b>RPO</b> — how much data you can lose (time since last good backup). <b>RTO</b> — how long until restored. <b>MTTR</b> — mean time to repair. <b>MTBF</b> — mean time between failures.</li><li>Sites: <b>hot</b> (ready now), <b>warm</b> (hardware, needs data), <b>cold</b> (space and power only), <b>cloud</b> site.</li><li><b>Active-active</b> (both carry load) vs <b>active-passive</b> (standby waits).</li><li>Testing: <b>tabletop exercise</b>, validation tests, failover drills.</li><li>Redundancy everywhere: dual PSUs, UPS, generators, diverse ISP paths, NIC teaming, FHRP, clustering.</li></ul>' },
      { h: 'Lab', html: '<p>Documentation lab: use <code>show cdp neighbors</code> to discover what is connected where, then label every connected interface with <code>description</code> naming the neighbor. This is what good engineers do on every device they touch.</p>' }

      ['Baseline', 'Documented normal performance used to spot anomalies.'], ['Throughput', 'Actual data rate achieved.'], ['Latency', 'Delay, usually in ms.'], ['Jitter', 'Variation in latency; harms VoIP/video.'], ['CRC errors', 'Corrupted frames — usually Layer 1 (cable, EMI, duplex).'],
      ['Giants / runts', 'Frames over max size / under 64 bytes.'], ['DSCP EF (46)', 'Expedited forwarding — voice priority marking.'], ['CoS', '802.1p 3-bit priority in the VLAN tag.'], ['Traffic shaping vs policing', 'Shaping buffers/delays excess; policing drops/remarks it.'],

  S.push({
    id: 's13', tier: 'c', title: 'Network security', code: 'NET13-LOCKED-GATE',
    goal: 'CIA, attacks, segmentation, ACLs, AAA, VPNs, hardening, physical security and compliance.',
    lesson: [
      { h: 'Core concepts', html: '<ul><li><b>CIA triad</b>: confidentiality, integrity, availability.</li><li><b>Least privilege</b>, <b>defense in depth</b>, <b>zero trust</b> (verify every request; no implicit trust from location).</li><li><b>AAA</b>: authentication (who), authorization (what), accounting (log what was done). <b>RADIUS</b> (UDP, encrypts password only, network access) vs <b>TACACS+</b> (TCP 49, encrypts whole payload, separates AAA — best for device admin). <b>LDAP/LDAPS</b>, <b>Kerberos</b>, <b>SAML</b> (web SSO), <b>MFA</b> (know/have/are/somewhere).</li><li><b>Encryption</b> in transit (TLS, IPsec, SSH) and at rest. <b>PKI</b>/certificates.</li></ul>' },
      { h: 'Attacks you must recognize', html: '<table><tr><th>Attack</th><th>What it does</th><th>Defense</th></tr>' +
        [['DoS / DDoS', 'Floods to exhaust resources (botnets)', 'Rate limiting, upstream scrubbing, CDN'], ['On-path (MITM)', 'Intercepts traffic between victims', 'Encryption, DAI, 802.1X'], ['ARP spoofing/poisoning', 'Fake ARP replies redirect traffic', 'Dynamic ARP Inspection'], ['DNS poisoning/spoofing', 'Fake DNS answers', 'DNSSEC'], ['Rogue DHCP', 'Hands out attacker gateway/DNS', 'DHCP snooping'], ['DHCP starvation', 'Exhausts the pool', 'DHCP snooping, port security'], ['MAC flooding', 'Fills CAM table → switch floods like a hub', 'Port security'], ['VLAN hopping', 'Switch spoofing / double tagging', 'Disable DTP, change native VLAN'], ['Rogue AP', 'Unauthorized AP on the LAN', 'WIPS, NAC, 802.1X'], ['Evil twin', 'Fake AP with your SSID', 'WPA2/3-Enterprise with cert validation'], ['Deauth', 'Kicks Wi-Fi clients off', '802.11w protected management frames'], ['Social engineering', 'Phishing, tailgating, shoulder surfing, dumpster diving', 'Training, mantraps, shredding'], ['Malware / ransomware', 'Malicious code', 'EDR, patching, backups']].map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>'; }).join('') + '</table>' },
      { h: 'Segmentation & access control', html: '<ul><li><b>VLANs/subnets</b>, <b>screened subnet</b> (DMZ) for public servers, guest networks, <b>IoT/OT isolation</b>, <b>air gaps</b>.</li><li><b>ACLs</b> — processed top-down, first match wins, <b>implicit deny</b> at the end. <b>Standard ACL</b> (1–99) matches source only → place near the destination. <b>Extended</b> (100–199) matches src/dst/protocol/port → place near the source.</li><li><b>Firewalls</b>: stateless packet filter vs <b>stateful</b> vs <b>NGFW</b> (app-aware, IPS, URL filtering). <b>IDS</b> detects, <b>IPS</b> blocks inline.</li><li><b>NAC</b> + <b>802.1X</b> port authentication (supplicant → authenticator switch → RADIUS server); posture checks.</li><li><b>Port security</b>: limit MACs per port, sticky MACs, violation shutdown.</li></ul>' +
        '<pre>R1(config)# access-list 110 deny tcp 192.168.20.0 0.0.0.255 host 10.9.9.10 eq 80\nR1(config)# access-list 110 permit ip any any\nR1(config)# interface g0/0.20\nR1(config-subif)# ip access-group 110 in</pre>' +
        '<div class="callout trap"><b class="k">Exam trap</b>An ACL with only deny statements blocks EVERYTHING because of the implicit deny. Always end with the permit you intend.</div>' },
      { h: 'VPNs & remote access', html: '<ul><li><b>Site-to-site</b> (IPsec tunnel between gateways) vs <b>client-to-site</b> (remote user).</li><li><b>Full tunnel</b> (all traffic through HQ) vs <b>split tunnel</b> (only corporate traffic).</li><li><b>IPsec</b>: IKE phase 1/2, ESP (encrypt), AH (integrity), tunnel vs transport mode. <b>SSL/TLS VPN</b> (clientless via browser possible).</li><li>Remote management: <b>SSH</b>, HTTPS GUI, <b>out-of-band</b> management (console server / separate network), <b>jump box</b>.</li></ul>' },
      { h: 'Hardening checklist', html: '<ul><li>Change default credentials; <code>enable secret</code>; <code>service password-encryption</code>.</li><li>SSH only on VTY lines (<code>transport input ssh</code>); disable Telnet/HTTP.</li><li>Shut down unused ports and put them in an unused VLAN.</li><li>Disable unused services; patch firmware; SNMPv3; NTP; logging to syslog.</li><li>Control plane policing, management ACLs, separate management VLAN.</li><li>Key management, certificates, secure boot.</li></ul>' },
      { h: 'Physical & compliance', html: '<p>Cameras, badge readers, <b>access control vestibule</b> (mantrap), locks, locking racks, environmental controls. Compliance: <b>PCI DSS</b> (card data), <b>GDPR</b> (EU privacy), data locality/sovereignty. Asset disposal: factory reset, sanitize/destroy media.</p>' }
    ],
    cards: [
      ['CIA triad', 'Confidentiality, integrity, availability.'], ['Zero trust', 'Never trust, always verify every request; no implicit trust by network location.'], ['Least privilege', 'Only the access needed to do the job.'], ['Defense in depth', 'Multiple layered controls.'],
      ['AAA', 'Authentication, authorization, accounting.'], ['RADIUS', 'UDP 1812/1813; encrypts only the password; network access AAA.'], ['TACACS+', 'TCP 49; encrypts entire payload; separates AAA; device administration.'], ['MFA', 'Two or more factor types: know, have, are (plus somewhere you are).'], ['SAML', 'XML-based web single sign-on.'],
      ['Standard ACL', 'Numbered 1–99; matches source only; place near destination.'], ['Extended ACL', 'Numbered 100–199; matches source, destination, protocol, port; place near source.'], ['Implicit deny', 'Invisible deny-all at the end of every ACL.'],
      ['Screened subnet (DMZ)', 'Network segment for public-facing servers between outside and inside.'], ['Stateful firewall', 'Tracks connection state; allows return traffic automatically.'], ['NGFW', 'Next-generation firewall: application awareness, IPS, URL filtering.'], ['IDS vs IPS', 'Detects and alerts vs sits inline and blocks.'],
      ['802.1X', 'Port-based network access control: supplicant, authenticator, authentication server (RADIUS).'], ['NAC', 'Network access control — checks identity and posture before granting access.'], ['Port security', 'Limits/learns MAC addresses on a switch port.'],
      ['DHCP snooping', 'Allows DHCP server replies only on trusted ports; stops rogue DHCP.'], ['Dynamic ARP Inspection', 'Validates ARP against DHCP snooping bindings; stops ARP spoofing.'], ['Evil twin', 'Rogue AP impersonating a legitimate SSID.'], ['On-path attack', 'Attacker intercepts/relays traffic (MITM).'], ['DDoS', 'Distributed denial of service from many sources (botnet).'],
      ['Site-to-site VPN', 'Permanent encrypted tunnel between networks.'], ['Split tunnel', 'Only corporate traffic goes through the VPN.'], ['Full tunnel', 'All client traffic goes through the VPN.'], ['Out-of-band management', 'Managing devices over a separate path (console server/cellular) independent of production.'], ['Jump box', 'Hardened host used to reach management interfaces.'],
      ['Access control vestibule', 'Mantrap — two doors, only one opens at a time; stops tailgating.'], ['PCI DSS', 'Security standard for handling payment card data.'], ['Tailgating', 'Following an authorized person through a secure door.']
    ],
    qs: [
      Q('Device administrators need command-level authorization and fully encrypted AAA traffic. Which protocol?', 'TACACS+', ['RADIUS', 'LDAP', 'Kerberos'], 'TACACS+ encrypts the entire payload and separates authorization.', 4),
      Q('Users suddenly receive a wrong default gateway from an unknown DHCP server. What prevents this?', 'DHCP snooping', ['Port mirroring', 'BPDU guard', 'Jumbo frames'], 'Snooping trusts DHCP offers only on uplink/server ports.', 4),
      Q('An attacker floods a switch with fake source MACs and then sees traffic for other hosts. Defense?', 'Port security limiting MACs per port', ['DNSSEC', 'STP root guard', 'Longer DHCP leases'], 'MAC flooding fills the CAM table; port security caps learned MACs.', 4),
      Q('An extended ACL should generally be placed:', 'As close to the source as possible', ['As close to the destination as possible', 'Only on the Internet router', 'On every interface'], 'Extended ACLs can be specific, so drop unwanted traffic early. Standard ACLs go near the destination.', 4),
      Q('An ACL contains only "deny tcp any host 10.1.1.1 eq 23". What happens to all other traffic through that interface?', 'It is blocked by the implicit deny', ['It is permitted', 'It is logged only', 'It is rate limited'], 'Every ACL ends with an invisible deny any.', 5),
      Q('A public web server should be reachable from the Internet but isolated from the internal LAN. Place it in a:', 'Screened subnet (DMZ)', ['Native VLAN', 'Voice VLAN', 'Management VLAN'], 'DMZ sits between outside and inside zones.', 4),
      Q('Which device can block malicious traffic inline in real time?', 'IPS', ['IDS', 'SIEM', 'NetFlow collector'], 'IDS only alerts.', 4),
      Q('An employee follows a contractor through a badge door without scanning. Which control stops this?', 'Access control vestibule (mantrap)', ['MFA', 'Port security', 'Cable locks'], 'Vestibules allow one person per authenticated cycle.', 4),
      Q('Remote users should send only corporate traffic through the VPN and browse the Internet directly. This is:', 'Split tunnel', ['Full tunnel', 'Site-to-site', 'Clientless'], 'Split tunnel reduces load on HQ but means less inspection of user traffic.', 4),
      Q('A switch port should authenticate devices against RADIUS before granting network access. Which standard?', '802.1X', ['802.1Q', '802.3af', '802.11w'], 'Supplicant–authenticator–authentication server.', 4),
      Q('Users connect to "CorpWiFi" in the lobby; credentials are stolen. Security finds an AP not owned by IT broadcasting that SSID. This is:', 'Evil twin', ['Rogue DHCP', 'War driving', 'Bluejacking'], 'A rogue AP impersonating a legitimate SSID.', 4),
      Q('Which pair of protocols should replace Telnet and HTTP for device management?', 'SSH and HTTPS', ['FTP and SNMPv1', 'RDP and TFTP', 'SMB and POP3'], 'Encrypt management traffic.', 4),
      Q('Which hardening step defeats attackers who plug into empty wall jacks?', 'Disable unused switch ports and assign them to an unused VLAN', ['Enable PoE on every port', 'Increase DHCP lease time', 'Use a larger subnet'], 'Shut what you do not use; 802.1X/NAC for the rest.', 4),
      Q('Which principle says no user or device is trusted by default, even inside the network?', 'Zero trust', ['Defense in depth', 'Implicit trust', 'Separation of duties'], 'Verify every access request.', 4),
      Q('A store processes credit cards. Which standard governs its network security?', 'PCI DSS', ['GDPR', 'HIPAA', 'SOX only'], 'Payment Card Industry Data Security Standard.', 4),
      Q('Thousands of compromised IoT devices flood your web server. This is:', 'DDoS', ['On-path attack', 'Phishing', 'VLAN hopping'], 'Distributed denial of service from a botnet.', 4),
      Q('Which control validates ARP replies against DHCP snooping bindings?', 'Dynamic ARP Inspection', ['Port mirroring', 'BPDU guard', 'IP helper'], 'DAI blocks ARP poisoning.', 4),
      Q('A technician must manage routers even when the production network is down. Best solution?', 'Out-of-band management via console server or cellular', ['In-band SSH only', 'Telnet over the WAN', 'A larger subnet'], 'OOB is independent of production paths.', 4),
      T('In an ACL, which one-word keyword matches exactly one IP address (same as wildcard 0.0.0.0)?', ['host'], '"host 10.1.1.1" = 10.1.1.1 0.0.0.0.', 4),
      T('Type the global config command that sets an encrypted privileged password "N3tPlus!".', ['enable secret N3tPlus!', 'enable secret n3tplus!'], 'enable secret uses a strong hash; enable password does not.', 4, 'IOS command')
    ],
    labs: ['l-acl', 'l-harden']
  });

  S.push({
    id: 's14', tier: 'c', title: 'Troubleshooting methodology & tools', code: 'NET14-ROOT-CAUSE',
    goal: 'The CompTIA 7-step method, every command-line tool, and how to read symptoms like a senior tech.',
    lesson: [
      { h: 'The CompTIA troubleshooting methodology (memorize in order)', html: '<ol><li><b>Identify the problem</b> — gather info, question users, identify symptoms, determine if anything changed, duplicate the problem, approach multiple problems individually.</li><li><b>Establish a theory of probable cause</b> — question the obvious; top-to-bottom / bottom-to-top OSI, divide and conquer.</li><li><b>Test the theory</b> to determine cause — if confirmed, next steps; if not, new theory or <b>escalate</b>.</li><li><b>Establish a plan of action</b> to resolve the problem and identify potential effects.</li><li><b>Implement the solution or escalate</b> as necessary.</li><li><b>Verify full system functionality</b> and, if applicable, implement preventive measures.</li><li><b>Document findings, actions, outcomes, and lessons learned</b>.</li></ol>' +
        '<div class="callout trap"><b class="k">Exam trap</b>Questions love "what should the technician do NEXT?" Find where the scenario is in the 7 steps. Documentation is always LAST. Testing comes BEFORE the plan.</div>' },
      { h: 'Command-line tools', html: '<table><tr><th>Tool</th><th>Use</th></tr>' +
        [['ping', 'Reachability (ICMP)'], ['tracert / traceroute', 'Hop-by-hop path, finds where it dies'], ['pathping (Win) / mtr', 'Trace + per-hop loss over time'], ['ipconfig / ip addr / ifconfig', 'Local IP config; ipconfig /release /renew /flushdns /all'], ['nslookup / dig', 'Query DNS'], ['arp -a', 'View ARP cache'], ['netstat / ss', 'Active connections and listening ports'], ['route print / ip route', 'Host routing table'], ['tcpdump', 'CLI packet capture'], ['nmap', 'Port/host scanning'], ['hostname', 'Show name'], ['curl', 'Test HTTP/S'], ['show interface / show ip int brief', 'Device interface status, errors'], ['show ip route', 'Router table'], ['show vlan / show interfaces trunk', 'Switching'], ['show mac address-table', 'Which port a MAC is on'], ['show cdp/lldp neighbors', 'What is plugged in where']].map(function (r) { return '<tr><td><code>' + r[0] + '</code></td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>' },
      { h: 'Symptom → cause cheat sheet', html: '<table><tr><th>Symptom</th><th>Think</th></tr>' +
        [['169.254.x.x address', 'DHCP unreachable: VLAN, cable, scope full, relay missing'], ['Can ping IP but not name', 'DNS'], ['Can reach local, not remote', 'Default gateway / routing'], ['One VLAN fails across trunk', 'VLAN not allowed or not created'], ['Intermittent, CRC errors', 'Cable, EMI, duplex, bad optic'], ['Slow + late collisions', 'Duplex mismatch'], ['Network-wide meltdown, LEDs solid', 'Broadcast storm / STP loop'], ['Duplicate IP warning', 'Static IP inside DHCP pool'], ['Works for some sites, MTU-sized packets fail', 'MTU/fragmentation, blackhole'], ['Users get IP from wrong network', 'Rogue DHCP'], ['Asymmetric routing breaks firewall sessions', 'Return path differs from forward path'], ['Traceroute loops between two routers', 'Routing loop'], ['Port err-disabled', 'Port security / BPDU guard violation'], ['Wi-Fi drops near microwaves', '2.4 GHz interference']].map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>' },
      { h: 'Hardware tools', html: '<p>Cable tester, TDR/OTDR, toner/probe, light meter, multimeter, loopback plug, spectrum/Wi-Fi analyzer, protocol analyzer, punchdown tool, crimper, visual fault locator (red laser for fiber).</p>' },
      { h: 'Labs', html: '<p>Two broken networks. Nobody tells you what is wrong. Use <code>ipconfig</code>, <code>ping</code>, <code>tracert</code>, <code>show ip int brief</code>, <code>show vlan brief</code>, <code>show interfaces trunk</code>, <code>show ip route</code> and <code>show access-lists</code>. The <span style="color:var(--lock)">[sim hint]</span> lines tell you where the packet died — treat them like what a capture would show you.</p>' }
    ],
    cards: [
      ['Troubleshooting step 1', 'Identify the problem.'], ['Troubleshooting step 2', 'Establish a theory of probable cause.'], ['Troubleshooting step 3', 'Test the theory to determine the cause.'], ['Troubleshooting step 4', 'Establish a plan of action and identify potential effects.'], ['Troubleshooting step 5', 'Implement the solution or escalate.'], ['Troubleshooting step 6', 'Verify full system functionality; implement preventive measures.'], ['Troubleshooting step 7', 'Document findings, actions, outcomes and lessons learned.'],
      ['tracert / traceroute', 'Shows each hop by exploiting TTL expiry (ICMP Time Exceeded).'], ['pathping / mtr', 'Combines traceroute with per-hop loss statistics.'], ['nslookup / dig', 'Query DNS servers directly.'], ['netstat', 'Shows connections and listening ports.'], ['arp -a', 'Displays the ARP cache.'], ['ipconfig /flushdns', 'Clears local DNS cache.'], ['ipconfig /release /renew', 'Drops and requests a new DHCP lease.'], ['nmap', 'Network/port scanner.'], ['tcpdump', 'Command-line packet capture.'],
      ['Asymmetric routing', 'Forward and return traffic take different paths; breaks stateful firewalls.'], ['Routing loop', 'Packets bounce between routers until TTL expires.'], ['Err-disabled', 'Port shut by the switch due to a violation (port security, BPDU guard).'], ['Visual fault locator', 'Red laser that shows breaks/bends in fiber.'], ['Loopback plug', 'Tests a port by looping its transmit back to receive.']
    ],
    qs: [
      Q('A tech has confirmed the cause of an outage. What is the NEXT step?', 'Establish a plan of action and identify potential effects', ['Document findings', 'Verify full system functionality', 'Question the users'], 'Step 3 (test) done → step 4 (plan).', 5),
      Q('A tech replaced a failed switch and service is restored. What comes next?', 'Verify full system functionality and implement preventive measures', ['Document findings', 'Establish a theory', 'Escalate'], 'Step 6 before step 7.', 5),
      Q('What is the FINAL step of the methodology?', 'Document findings, actions, outcomes and lessons learned', ['Verify functionality', 'Implement the solution', 'Escalate'], 'Documentation is always last.', 5),
      Q('A user can reach 8.8.8.8 but not www.example.com. Which tool next?', 'nslookup (or dig)', ['tracert', 'arp -a', 'netstat'], 'Name resolution failing, IP works → DNS.', 5),
      Q('Which tool shows where along the path packets stop?', 'tracert / traceroute', ['ipconfig', 'nslookup', 'arp'], 'Each hop reports via ICMP Time Exceeded.', 5),
      Q('A server should listen on TCP 8443. Which command on the server confirms it is listening?', 'netstat -an (or ss -tln)', ['ipconfig /all', 'tracert', 'nslookup'], 'netstat/ss list listening sockets.', 5),
      Q('A user gets a duplicate IP warning daily at 9 AM. Most likely cause?', 'A statically assigned device uses an address inside the DHCP pool', ['DNS TTL too long', 'Spanning tree reconvergence', 'Jumbo frames enabled'], 'Exclude static addresses from the scope or use reservations.', 5),
      Q('Traceroute shows hops alternating 10.0.0.1, 10.0.0.2, 10.0.0.1, 10.0.0.2 until it times out. What is wrong?', 'A routing loop between those two routers', ['DNS failure', 'Duplex mismatch', 'Bad cable'], 'Each router thinks the other is the path.', 5),
      Q('After a Windows laptop moves to a new network, it keeps its old IP. Which command gets a fresh one?', 'ipconfig /release then ipconfig /renew', ['ipconfig /flushdns', 'arp -d', 'netstat -r'], 'Release/renew triggers DORA.', 5),
      Q('A switch port goes err-disabled whenever a user plugs in their own laptop next to the docking station. Likely cause?', 'Port security MAC limit violation', ['DNS failure', 'Native VLAN mismatch', 'MTU mismatch'], 'Too many MACs learned → violation → shutdown.', 5),
      Q('Users can reach some websites but large downloads and VPN sessions hang. Small pings work; pings with large DF-set packets fail. Cause?', 'MTU mismatch / fragmentation black hole', ['DNS poisoning', 'DHCP exhaustion', 'Wrong VLAN'], 'Test with ping -f -l 1472 (Windows). Common across tunnels.', 5),
      Q('A help desk ticket says "the Internet is down" for one user. What should the tech do FIRST?', 'Gather information and question the user (identify the problem)', ['Reboot the core router', 'Replace the user\'s NIC', 'Escalate to the ISP'], 'Step 1. Determine scope and what changed.', 5),
      Q('A firewall drops return traffic because replies come back through a different firewall than the requests used. This is:', 'Asymmetric routing', ['Routing loop', 'Split horizon', 'NAT overload'], 'Stateful firewalls must see both directions.', 5),
      Q('Which tool would you use to find a cable\'s far end in a patch panel?', 'Toner and probe', ['Wi-Fi analyzer', 'Protocol analyzer', 'Multimeter only'], 'Fox and hound.', 5),
      Q('Two hosts in the same VLAN cannot ping each other; both show correct IPs. On the switch, one host\'s port shows the wrong access VLAN. Which command revealed it?', 'show vlan brief', ['show ip route', 'show ip ospf neighbor', 'show clock'], 'show vlan brief lists ports per VLAN.', 5),
      Q('Which tool combines traceroute with per-hop packet loss statistics on Windows?', 'pathping', ['tracert', 'nbtstat', 'nslookup'], 'pathping (Linux: mtr).', 5),
      Q('A user\'s PC has IP 10.1.5.20/24 and gateway 10.1.5.1. It reaches local servers but nothing remote. Other users on the subnet are fine. Next check?', 'Whether the user\'s gateway is mistyped (e.g., 10.1.5.11)', ['Router routing table', 'ISP status', 'DNS MX records'], 'Others work → router fine. Compare the host config to a working peer.', 5),
      Q('Which command displays the MAC addresses a Windows host has resolved?', 'arp -a', ['ipconfig /displaydns', 'route print', 'netstat -s'], 'ARP cache.', 5),
      { gen: 'osi', d: 1 },
      T('Type the Linux command that tests DNS and is the more detailed alternative to nslookup.', ['dig'], 'dig example.com A', 5)
    ],
    labs: ['l-ts1', 'l-ts2']
  });

  S.push({
    id: 's15', tier: 'x', title: 'Capstone: N10-009 exam simulation', code: 'NET15-WALK-IN-THE-PARK',
    goal: 'A full-length, domain-weighted, timed exam plus a from-scratch branch build. Pass this and book the real exam.',
    capstone: { n: 90, minutes: 90 },
    lesson: [
      { h: 'What the real exam looks like', html: '<ul><li><b>N10-009</b>: up to 90 questions, 90 minutes, multiple choice + <b>performance-based questions (PBQs)</b>.</li><li>Passing score: <b>720</b> on a 100–900 scale.</li><li>Domains: Networking Concepts 23%, Implementation 20%, Operations 19%, Security 14%, Troubleshooting 24%.</li></ul><p>This capstone draws 90 questions from every exam-tier step in exactly those proportions (subnetting questions are freshly generated each attempt), with a 90-minute timer. You need <b>over 90%</b> — well above the real bar, so the real exam feels easy.</p>' },
      { h: 'Exam strategy', html: '<ol><li><b>Skip PBQs first</b>, flag them, answer all multiple choice, then come back. PBQs eat time.</li><li>Write your cheat sheet in the first 2 minutes on the dry-erase board: subnet table, 128-64-32 bits, OSI layers, troubleshooting steps, port list you struggle with.</li><li>Read the LAST sentence first — it tells you what they actually want ("BEST", "FIRST", "MOST likely").</li><li>Eliminate two wrong answers, then pick between the remaining two.</li><li>Never leave anything blank — no penalty for guessing.</li></ol>' },
      { h: 'Final lab', html: '<p>The branch build lab is a mini-PBQ on steroids: VLANs, trunk, router-on-a-stick, DHCP and a route to HQ — from a blank config. It is what a junior network admin actually does in week one.</p>' }
    ],
    cards: [
      ['N10-009 passing score', '720 on a scale of 100–900.'], ['N10-009 length', 'Up to 90 questions, 90 minutes.'], ['Domain weights', 'Concepts 23%, Implementation 20%, Operations 19%, Security 14%, Troubleshooting 24%.'], ['PBQ strategy', 'Flag and skip performance-based questions first; return after multiple choice.']
    ],
    qs: [
      Q('On the real exam, what is the smartest way to handle a performance-based question that appears first?', 'Flag it, answer the multiple choice, and come back', ['Spend as long as needed on it first', 'Leave it blank permanently', 'End the exam early'], 'PBQs are time sinks; secure the easy points first.', 5),
      // ---- capstone-only bank: Operations (3.0)
      Q('Which protocol should be used to send device logs to a central server over an encrypted channel?', 'Syslog over TLS', ['SNMPv1', 'TFTP', 'Telnet'], 'Secure syslog (TLS, TCP 6514) protects log integrity and confidentiality.', 3),
      Q('A network admin wants alerts when a switch\'s temperature crosses a threshold, without polling. Configure:', 'SNMP traps to the NMS', ['NetFlow export', 'Port mirroring', 'A DHCP reservation'], 'Traps are pushed by the agent the moment the event occurs.', 3),
      Q('Which document lists every switch, its serial number, location, and warranty date?', 'Asset inventory', ['Logical diagram', 'Change request', 'AUP'], 'Asset management tracks hardware lifecycle.', 3),
      Q('What is the purpose of a maintenance window?', 'A pre-approved time when changes can be made with minimal business impact', ['A time when monitoring is disabled permanently', 'A window in the data center', 'The DHCP lease period'], 'Changes happen inside agreed windows to limit impact.', 3),
      Q('A technician wants to know what normal CPU and bandwidth look like on a WAN router each weekday. What should they create?', 'A performance baseline', ['A rack diagram', 'An SLA', 'A VLAN'], 'Baselines define normal for comparison.', 3),
      Q('Which metric best describes how long, on average, a device runs before it fails?', 'MTBF', ['MTTR', 'RTO', 'RPO'], 'Mean time between failures.', 3),
      Q('A business needs servers restored within 2 hours of a disaster. This requirement is the:', 'RTO', ['RPO', 'MTBF', 'SLA credit'], 'Recovery Time Objective is about downtime.', 3),
      Q('Which DR site type can take over almost immediately because it has current data and running systems?', 'Hot site', ['Cold site', 'Warm site', 'Branch office'], 'Hot = ready now, most expensive.', 3),
      Q('Which tool collects, normalizes and correlates logs from firewalls, servers and switches and raises alerts?', 'SIEM', ['NetFlow analyzer only', 'Cable certifier', 'IPAM'], 'Security Information and Event Management.', 3),
      Q('An engineer needs to see which applications consume the most bandwidth on the Internet link over the past week. Best data source?', 'Flow records (NetFlow/IPFIX/sFlow)', ['Syslog severity 7', 'ARP tables', 'show vlan brief'], 'Flows summarize conversations by IP/port/bytes.', 3),
      Q('Which QoS action delays excess traffic in a buffer rather than dropping it?', 'Shaping', ['Policing', 'Marking', 'Classification'], 'Shaping smooths bursts; policing drops/remarks.', 3),
      Q('What is the main purpose of a configuration backup taken before every change?', 'To restore the last known-good configuration quickly if the change fails', ['To satisfy DHCP', 'To enable SNMP', 'To reduce latency'], 'Part of every backout plan.', 3),
      Q('Interface counters show many giants on a port. What does that indicate?', 'Frames larger than the allowed MTU are arriving', ['Frames smaller than 64 bytes', 'Too many VLANs', 'DNS failures'], 'Giants = oversized frames, often an MTU/jumbo mismatch.', 3),
      Q('Which policy defines what employees may and may not do on company networks?', 'AUP (acceptable use policy)', ['SLA', 'MOU', 'BYOD SOP only'], 'Users usually sign the AUP.', 3),
      Q('A firm needs a written agreement with a partner that is less formal than a contract, outlining shared goals. What document?', 'MOU', ['SLA', 'NDA', 'AUP'], 'Memorandum of understanding.', 3),
      Q('Which approach to high availability has a standby firewall waiting idle until the primary fails?', 'Active-passive', ['Active-active', 'Load balancing', 'Clustering with ECMP'], 'Standby takes over on failure.', 3),
      Q('What does an IPAM tool primarily manage?', 'IP address space, subnets, DHCP and DNS records', ['Wi-Fi channels', 'Cable labels', 'Firmware images'], 'IP Address Management.', 3),
      Q('Which statement about NTP stratum is correct?', 'Lower stratum numbers are closer to the reference clock', ['Higher stratum is more accurate', 'Stratum 0 is a desktop PC', 'Stratum is the number of VLANs'], 'Stratum 0 = atomic/GPS clock; stratum 1 servers sync to it.', 3),

(function () {

  S.push({
    id: 'p16', tier: 'pro', title: 'Enterprise design & high availability', code: 'PRO16-NO-SINGLE-POINT',
    goal: 'Design networks that survive failures: redundancy patterns, floating routes, capacity planning and the business conversation.',
    lesson: [
      { h: 'Think in failure domains', html: '<p>A senior engineer looks at every diagram and asks: <b>"what happens when this box dies?"</b> A failure domain is everything that breaks together — one closet switch, one power circuit, one ISP, one data center. Good design keeps failure domains small and redundancy <i>diverse</i> (two ISPs that share the same conduit under the same street are one failure domain).</p>' },
      { h: 'Redundancy patterns', html: '<ul><li><b>Dual-homed access</b>: every access switch uplinks to two distribution switches (STP or MLAG/vPC/StackWise Virtual to use both).</li><li><b>MLAG / vPC</b>: two physical switches present one logical LACP partner — no blocked STP links.</li><li><b>FHRP</b> (HSRP/VRRP) on the distribution pair for gateways; align the STP root with the active FHRP router.</li><li><b>Routed access</b>: push Layer 3 to the access layer — no STP across the campus, ECMP uplinks, fast convergence.</li><li><b>ECMP</b>: equal-cost multipath — routers load-share across identical-cost routes.</li><li><b>WAN</b>: dual circuits, dual carriers, diverse entry points; SD-WAN or BGP for failover.</li><li><b>Floating static routes</b> for cheap backup paths.</li></ul>' },
      { h: 'Convergence engineering', html: '<p>How fast you recover matters as much as whether you recover. Tools: <b>BFD</b> (sub-second failure detection), tuned OSPF timers, <b>graceful restart/NSF</b>, RSTP everywhere, LACP fast rate. Measure it: pull a cable during a maintenance window with a continuous ping running and count the drops.</p>' },
      { h: 'Capacity planning', html: '<ul><li><b>Oversubscription ratio</b>: 48 × 1G access ports with 2 × 10G uplinks = 48:20 = 2.4:1 (fine for users; data centers want closer to 1:1 – 3:1).</li><li>Watch 95th-percentile utilization, not averages. Plan upgrades at a sustained 60–70%.</li><li>PoE budget: sum of device draw vs switch power supply capacity.</li><li>Growth: IP space (do not build /24s for floors that will need 300 devices), port counts, rack power/cooling.</li></ul>' },
      { h: 'The business side', html: '<p>Redundancy costs money. Translate risk into dollars: <b>cost of an hour of downtime × expected outage hours per year</b> vs the price of the second circuit. That is how you get budget approved. Write designs with: requirements, constraints, assumptions, risks, diagrams, rollout plan, rollback plan, cost.</p>' +
        '<div class="callout pro"><b class="k">War story pattern</b>"We had two firewalls in HA… both plugged into the same PDU." "We had two ISPs… both routed through the same fiber hut." Redundancy that has never been tested is a rumor.</div>' },
      { h: 'Lab', html: '<p>Floating static route: primary path to the data center over a fiber link, backup over a slower link with AD 200. Prove failover by shutting the primary.</p>' }
    ],
    cards: [
      ['Failure domain', 'Set of components that fail together.'], ['MLAG / vPC', 'Two switches act as one LACP partner so both uplinks forward without STP blocking.'], ['Routed access', 'Layer 3 at the access layer; eliminates campus-wide STP.'], ['ECMP', 'Equal-cost multipath load sharing.'],
      ['BFD', 'Bidirectional Forwarding Detection — sub-second link/neighbor failure detection.'], ['Oversubscription ratio', 'Total edge bandwidth ÷ uplink bandwidth.'], ['95th percentile', 'Utilization value exceeded only 5% of the time — standard for capacity/billing.'], ['NSF / graceful restart', 'Keeps forwarding during a control-plane restart.'],
      ['Diverse paths', 'Redundant links that do not share physical routes, conduits or providers.'], ['Floating static', 'Backup static route with AD higher than the primary route source.']

      Q('You want both uplinks from an access switch to two distribution switches to forward traffic, without STP blocking one. Best technology?', 'MLAG/vPC with LACP', ['RSTP PortFast', 'A floating static route', 'Port mirroring'], 'MLAG makes the pair look like one switch.'),
      Q('Which protocol detects a dead neighbor in milliseconds so routing can reconverge fast?', 'BFD', ['NTP', 'LLDP', 'SNMP'], 'BFD hellos are tiny and frequent; routing protocols subscribe to it.'),

  S.push({
    id: 'p17', tier: 'pro', title: 'Advanced routing: OSPF & BGP in practice', code: 'PRO17-SHORTEST-PATH',
    goal: 'Run OSPF for real, engineer paths with cost, read adjacencies, and understand how BGP chooses paths.',
    lesson: [
      { h: 'OSPF the way you run it at work', html: '<pre>R1(config)# router ospf 1\nR1(config-router)# router-id 1.1.1.1\nR1(config-router)# network 10.0.12.0 0.0.0.3 area 0\nR1(config-router)# network 192.168.1.0 0.0.0.255 area 0\nR1(config-router)# passive-interface g0/2</pre><ul><li>The <code>network</code> statement uses a <b>wildcard</b> and enables OSPF on any interface whose IP matches.</li><li><b>Passive interface</b>: advertise the subnet but send no hellos (user LANs) — security + less noise.</li><li><b>Router ID</b>: set it manually; otherwise highest loopback, then highest interface IP.</li><li>Neighbors must match: <b>area, subnet/mask, hello/dead timers, authentication, MTU</b>, network type. Mismatch = stuck in INIT/EXSTART or no neighbor at all.</li><li>States: Down → Init → 2-Way → ExStart → Exchange → Loading → <b>Full</b>.</li><li>On broadcast segments a <b>DR/BDR</b> is elected (highest priority, then router ID).</li><li><b>Cost</b> = reference bandwidth ÷ interface bandwidth. Default reference 100 Mbps makes 1G and 10G both cost 1 — raise it (<code>auto-cost reference-bandwidth 100000</code>) on modern networks.</li></ul>' },
      { h: 'Areas & LSAs (short version)', html: '<p>Multi-area OSPF keeps LSDBs small: everything connects to <b>area 0</b>. ABRs summarize between areas; ASBRs inject external routes. Stub/totally stubby/NSSA areas limit what LSAs enter. Route types in the table: O (intra-area), O IA (inter-area), O E1/E2 (external).</p>' },
      { h: 'BGP in one page', html: '<ul><li>Path-vector, TCP 179, neighbors configured manually. <b>eBGP</b> between ASes (AD 20), <b>iBGP</b> inside (AD 200).</li><li>Best path (simplified, Cisco order): highest <b>weight</b> → highest <b>local preference</b> → locally originated → shortest <b>AS path</b> → lowest origin → lowest <b>MED</b> → eBGP over iBGP → lowest IGP metric to next hop → oldest → lowest router ID.</li><li>Control outbound traffic with <b>local preference</b>; influence inbound with <b>AS-path prepending</b> or MED.</li><li>Real risk: <b>route leaks and hijacks</b> — defended with prefix filters and RPKI.</li></ul>' },
      { h: 'Troubleshooting OSPF', html: '<ol><li><code>show ip ospf neighbor</code> — is the neighbor there and FULL?</li><li>No neighbor: interface up? IPs in same subnet? Same area? Passive on that interface by mistake? ACL blocking 224.0.0.5?</li><li>Neighbor full but route missing: is the remote network matched by a <code>network</code> statement? Filtering? Summarization?</li><li><code>show ip protocols</code>, <code>show ip ospf interface</code>, <code>show ip route ospf</code>.</li></ol>' },
      { h: 'Labs', html: '<p>Lab 1: three routers in a triangle, OSPF everywhere, user LANs passive. Lab 2: traffic engineering — make R1 reach R3\'s LAN via R2 by changing cost, then verify with traceroute.</p>' }
    ],
    cards: [
      ['OSPF neighbor match requirements', 'Area, subnet/mask, hello/dead timers, authentication, MTU, network type.'], ['OSPF states', 'Down, Init, 2-Way, ExStart, Exchange, Loading, Full.'], ['Passive interface', 'Advertises the network but sends no hellos and forms no adjacency.'],
      ['OSPF router ID selection', 'Manually set → highest loopback IP → highest active interface IP.'], ['OSPF cost', 'Reference bandwidth ÷ interface bandwidth (default ref 100 Mbps).'], ['DR/BDR', 'Designated/backup designated router on multi-access segments.'], ['ABR', 'Area Border Router — connects an area to area 0.'], ['ASBR', 'Router injecting external routes into OSPF.'],
      ['O IA', 'OSPF inter-area route.'], ['O E2', 'OSPF external type 2 route (cost does not increase internally).'], ['BGP local preference', 'Higher wins; influences OUTBOUND path from your AS.'], ['AS-path prepending', 'Making a path look longer to influence INBOUND traffic.'], ['MED', 'Multi-Exit Discriminator — lower preferred; hint to a neighbor AS.'], ['RPKI', 'Cryptographic validation of BGP route origins.'], ['BGP weight', 'Cisco-local, highest wins, first tie-breaker.']
    ],
    qs: [
      Q('Two routers on the same link will not form an OSPF adjacency. One is area 0, the other area 1 on that interface. Result?', 'No adjacency — areas must match', ['They form FULL but drop routes', 'They elect a DR and work', 'They fall back to RIP'], 'Area ID is in the hello and must match.'),
      Q('You want OSPF to advertise a user LAN but not send hellos to user devices. Configure:', 'passive-interface on that LAN interface', ['shutdown on the LAN', 'A higher cost', 'area 1'], 'Passive stops hellos while still advertising the prefix.'),
      Q('Two OSPF routers stay stuck in EXSTART. Classic cause?', 'MTU mismatch', ['Area mismatch', 'Wrong router ID format', 'DHCP failure'], 'DBD exchange fails on mismatched MTU.'),
      Q('With default reference bandwidth, what OSPF cost do 1 Gbps and 10 Gbps links get?', 'Both 1 — so you should raise the reference bandwidth', ['10 and 1', '100 and 10', '1 and 0'], '100 Mbps / anything faster rounds to 1.'),
      Q('Which BGP attribute do you raise to make your routers prefer one exit for OUTBOUND traffic?', 'Local preference', ['MED', 'AS-path prepending', 'Origin'], 'Local pref is shared inside your AS; higher wins.'),
      Q('You want Internet traffic to come IN through ISP A rather than ISP B. Common technique?', 'AS-path prepending on advertisements to ISP B', ['Raise local preference on ISP B', 'Lower OSPF cost', 'Add a default route'], 'Longer AS path looks worse to the world.'),
      Q('In which OSPF state are two neighbors fully synchronized?', 'Full', ['2-Way', 'ExStart', 'Loading'], 'Full = LSDBs synchronized.'),
      Q('No router-id is configured, there is no loopback, and interfaces are 10.0.0.1 and 192.168.5.1. What is the OSPF router ID?', '192.168.5.1', ['10.0.0.1', '0.0.0.0', '1.1.1.1'], 'Highest active interface IP when no loopback/manual ID.'),
      Q('What does "O IA" mean in a routing table?', 'An OSPF route learned from another area', ['An OSPF route in the same area', 'An external route', 'A static route'], 'Inter-area.'),
      Q('Which port does BGP use?', 'TCP 179', ['UDP 179', 'TCP 89', 'IP protocol 89'], 'OSPF is IP protocol 89; BGP is TCP 179.'),
      Q('What prevents a random AS from originating your prefixes on the Internet?', 'RPKI route origin validation (plus prefix filtering)', ['STP', 'OSPF passive interfaces', 'NAT'], 'ROAs cryptographically bind prefix to origin AS.'),
      Q('Which OSPF network statement enables OSPF on 10.1.1.0/24 interfaces in area 0?', 'network 10.1.1.0 0.0.0.255 area 0', ['network 10.1.1.0 255.255.255.0 area 0', 'network 10.1.1.0/24 area 0', 'ospf enable 10.1.1.0'], 'OSPF network statements use wildcard masks.'),
